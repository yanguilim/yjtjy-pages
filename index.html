/* 进修时长趋势（累计，按周/按月） */
function studyTrendData(mode){
  var its=DB.study.items.slice().sort(function(a,b){
    return (a.y*10000+a.m*100+a.d)-(b.y*10000+b.m*100+b.d) || (a.t||'').localeCompare(b.t||'');
  });
  var map={}, order=[], i;
  for(i=0;i<its.length;i++){ var it=its[i], key;
    if(mode==='month'){ key=it.y+'-'+pad(it.m); }
    else { var dt=new Date(it.y, it.m-1, it.d), dow=(dt.getDay()+6)%7, mon=new Date(dt); mon.setDate(dt.getDate()-dow);
      key=mon.getFullYear()+'-'+pad(mon.getMonth()+1)+'-'+pad(mon.getDate()); }
    if(!map[key]){ map[key]=0; order.push(key); }
    map[key]+=(+it.hours||0);
  }
  var cum=0, pts=[];
  for(i=0;i<order.length;i++){ cum+=map[order[i]]; pts.push({key:order[i], val:cum}); }
  return pts;
}
function studyTrendSvg(pts, mode){
  if(!pts.length) return '<div class="muted">暂无学习记录，无法生成趋势。</div>';
  var W=640,H=260, pl=46,pr=16,pt=18,pb=34, iw=W-pl-pr, ih=H-pt-pb;
  var maxV=0; for(var i=0;i<pts.length;i++){ if(pts[i].val>maxV) maxV=pts[i].val; } maxV=Math.max(maxV,1);
  var n=pts.length;
  var xf=function(i){ return pl+(n<=1?iw/2:iw*i/(n-1)); };
  var yf=function(v){ return pt+ih*(1-v/maxV); };
  var path='', dots='', grid='', glabel='', xlab='', i;
  for(i=0;i<n;i++){ var x=xf(i), y=yf(pts[i].val);
    path += (i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.5" fill="#9D4EDD"><title>'+esc(pts[i].key)+' · 累计 '+pts[i].val.toFixed(1)+' h</title></circle>';
  }
  var area=path+' L'+xf(n-1).toFixed(1)+' '+(pt+ih).toFixed(1)+' L'+xf(0).toFixed(1)+' '+(pt+ih).toFixed(1)+' Z';
  for(var g=0; g<=4; g++){ var v=maxV*g/4, y=yf(v);
    grid += '<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#EEE" stroke-width="1"/>';
    glabel += '<text x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" font-size="10" fill="#9AA" text-anchor="end">'+v.toFixed(0)+'</text>';
  }
  var idxs = n<=6 ? pts.map(function(_,i){return i;}) : [0, Math.floor(n/2), n-1];
  idxs.forEach(function(i){ var x=xf(i); var lab=pts[i].key;
    if(mode==='month') lab=lab.slice(2);
    xlab += '<text x="'+x.toFixed(1)+'" y="'+(H-12)+'" font-size="10" fill="#678" text-anchor="middle">'+esc(lab.length>8?lab.slice(0,8):lab)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="max-width:660px">'+
    grid+glabel+'<path d="'+area+'" fill="#9D4EDD" fill-opacity="0.10"/>'+
    '<path d="'+path+'" fill="none" stroke="#9D4EDD" stroke-width="2.5" stroke-linejoin="round"/>'+dots+xlab+'</svg>';
}
function renderStudyTrend(m){
  var el=document.getElementById('st-trend'); if(!el) return;
  var mode=m?'month':'week';
  el.innerHTML=studyTrendSvg(studyTrendData(mode), mode);
  var b1=document.getElementById('st-tw'), b2=document.getElementById('st-tm');
  if(b1) b1.className='btn sm'+(m?'':' v');
  if(b2) b2.className='btn sm'+(m?' v':'');
}
function openStudyTrend(){
  openModal('学习时长趋势（累计）',
    '<div class="row no-print" style="margin-bottom:10px"><span class="tiny">横轴为时段，纵轴为截至该时段的累计学习时长（小时）</span>'+
    '<span style="margin-left:auto"></span>'+
    '<button id="st-tw" class="btn sm v" onclick="renderStudyTrend(0)">按周</button>'+
    '<button id="st-tm" class="btn sm" onclick="renderStudyTrend(1)">按月</button></div>'+
    '<div id="st-trend"></div>',
    '<button class="btn" onclick="closeModal()">关闭</button>');
  renderStudyTrend(1);
}

function studyItemById(id){ for(var i=0;i<DB.study.items.length;i++){ if(DB.study.items[i].id===id) return DB.study.items[i]; } return null; }
function addStudyProject(){ askPrompt('新增学习项目','项目名称，如：教师资格进修','', function(v){
  DB.study.projects.push({id:uid(), name:v, color:STUDY_COLORS[DB.study.projects.length%STUDY_COLORS.length]}); save(); refreshAll(); toast('项目已添加'); }); }
function delStudyProject(id){
  var n=studyItems(id).length;
  askConfirm('删除学习项目','该项目下有 <b>'+n+'</b> 条记录，删除项目会同时删除这些记录。确定？', function(){
    DB.study.projects=DB.study.projects.filter(function(p){ return p.id!==id; });
    DB.study.items=DB.study.items.filter(function(it){ return it.projectId!==id; });
    save(); refreshAll(); toast('已删除');
  }, '删除');
}
function renameStudyProject(id){
  var p=null; for(var i=0;i<DB.study.projects.length;i++){ if(DB.study.projects[i].id===id){ p=DB.study.projects[i]; break; } }
  if(!p) return;
  askPrompt('重命名学习项目','项目名称', p.name, function(v){
    v=(v||'').trim(); if(!v){ toast('名称不能为空'); return; }
    p.name=v; save(); refreshAll(); toast('已重命名');
  });
}
function openStudyForm(presetPid){
  if(!DB.study.projects.length){ toast('请先新增一个学习项目'); return; }
  var opts='', i, d=new Date(), sel=(presetPid||DB.study.projects[0].id);
  for(i=0;i<DB.study.projects.length;i++) opts += '<option value="'+DB.study.projects[i].id+'"'+(DB.study.projects[i].id===sel?' selected':'')+'>'+esc(DB.study.projects[i].name)+'</option>';
  openModal('新增学习记录',
    '<div class="inline-form"><div class="field"><label class="fl">学习项目</label><select id="st-p">'+opts+'</select></div>'+
    '<div class="field"><label class="fl">日期</label><input type="date" id="st-date" value="'+todayStr()+'"></div>'+
    '<div class="field"><label class="fl">时间</label><input type="time" id="st-time" value="'+pad(d.getHours())+':'+pad(d.getMinutes())+'"></div>'+
    '<div class="field"><label class="fl">学习时长（小时）</label><input type="number" step="0.1" inputmode="decimal" id="st-h" placeholder="1.5"></div></div>'+
    '<div class="field"><label class="fl">学习成果</label><textarea id="st-r" placeholder="例：完成《教育心理学》第三章笔记"></textarea></div>'+
    '<div class="field"><label class="fl">问题集锦（一行一个）</label><textarea id="st-q" placeholder="建构主义与行为主义的教学启示差异？"></textarea></div>'+
    '<div class="inline-form"><div class="field"><label class="fl">知识链接名称</label><input type="text" id="st-ln" placeholder="国家中小学智慧教育平台"></div>'+
    '<div class="field"><label class="fl">链接地址</label><input type="text" id="st-lu" placeholder="https://…（也可填 APP 唤起地址）"></div></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn v" onclick="saveStudy()">保存</button>');
}
function saveStudy(){
  var ds=($('st-date').value||todayStr()).split('-');
  var qs=$('st-q').value.split('\n').map(function(x){ return x.trim(); }).filter(function(x){ return x; });
  var links=[]; var ln=$('st-ln').value.trim(), lu=$('st-lu').value.trim();
  if(lu) links.push({name:ln||lu, url:lu});
  DB.study.items.unshift({id:uid(), projectId:$('st-p').value, y:+ds[0], m:+ds[1], d:+ds[2],
    t:$('st-time').value||'', hours:parseFloat($('st-h').value)||0, result:$('st-r').value.trim(),
    questions:qs, links:links, at:nowStr()});
  closeModal(); save(); refreshAll(); toast('学习记录已保存');
}
function delStudyItem(id){
  askConfirm('删除记录','确定删除这条学习记录？', function(){
    DB.study.items=DB.study.items.filter(function(it){ return it.id!==id; }); save(); refreshAll(); toast('已删除');
  }, '删除');
}
function addStudyQuestion(id){ var it=studyItemById(id); if(!it) return;
  askPrompt('添加问题','问题内容','', function(v){ if(!it.questions) it.questions=[]; it.questions.push(v); save(); refreshAll(); }); }
function delStudyQuestion(id, idx){ var it=studyItemById(id); if(!it) return;
  it.questions.splice(idx,1); save(); refreshAll(); }
function addStudyLink(id){ var it=studyItemById(id); if(!it) return;
  askPrompt('添加知识链接','格式：名称|网址（也可只填网址）','', function(v){
    var p=v.split('|'); var url=(p[1]||p[0]).trim(), nm=(p[1]?p[0]:url).trim();
    if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) url='https://'+url;
    if(!it.links) it.links=[]; it.links.push({name:nm, url:url}); save(); refreshAll(); }); }
function delStudyLink(id, idx){ var it=studyItemById(id); if(!it) return;
  it.links.splice(idx,1); save(); refreshAll(); }

/* =======================================================================
   花团锦簇 · 素材库
   ======================================================================= */
function switchLib(l){ UI.lib=l; UI.libProject='all'; renderLib(); }
function libMats(){
  var out=[], q=($('lib-q')?$('lib-q').value.trim().toLowerCase():'');
  for(var i=0;i<DB.lib.mats.length;i++){
    var m=DB.lib.mats[i];
    if(m.lib!==UI.lib) continue;
    if(UI.libProject!=='all' && (m.projects||[]).indexOf(UI.libProject)<0) continue;
    if(q){
      var pns=[]; for(var j=0;j<(m.projects||[]).length;j++) pns.push(projName(m.lib,m.projects[j]));
      var hay=((m.title||'')+' '+(m.text||'')+' '+pns.join(' ')).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    out.push(m);
  }
  return out.sort(function(a,b){ return a.at<b.at?1:-1; });
}
function renderLib(){
  var t=$('lib-title'), pbox=$('lib-projects'), lbox=$('lib-list');
  var bw=$('lib-tab-work'), bs=$('lib-tab-study');
  if(bw&&bs){
    if(UI.lib==='work'){ bw.classList.add('v'); bs.classList.remove('v'); }
    else { bs.classList.add('v'); bw.classList.remove('v'); }
  }
  if(t) t.textContent = UI.lib==='work'?'工作素材':'学习素材';
  var ps=DB.lib[UI.lib].projects, i, h='';
  if(pbox){
    var allN=0;
    for(i=0;i<DB.lib.mats.length;i++){ if(DB.lib.mats[i].lib===UI.lib) allN++; }
    h += '<button class="btn sm'+(UI.libProject==='all'?' v':'')+'" onclick="pickProject(\'all\')">全部 · '+allN+'</button>';
    for(i=0;i<ps.length;i++){
      var p=ps[i], n=0;
      for(var j=0;j<DB.lib.mats.length;j++){ var m=DB.lib.mats[j];
        if(m.lib===UI.lib && (m.projects||[]).indexOf(p.id)>=0) n++; }
      h += '<span class="tag'+(UI.libProject===p.id?' violet':'')+'" style="padding:6px 10px">'+
        '<button class="btn sm" style="min-height:20px;padding:0;border:0;background:none;font-size:13px" onclick="pickProject(\''+p.id+'\')">'+esc(p.name)+' · '+n+'</button>'+
        '<button class="btn sm" style="min-height:20px;padding:0 4px;border:0" onclick="renameProject(\''+p.id+'\')" title="改名"><svg><use href="#i-edit"/></svg></button>'+
        '<button class="btn sm danger" style="min-height:20px;padding:0 4px;border:0" onclick="clearProject(\''+p.id+'\')" title="清空该项目"><svg><use href="#i-trash"/></svg></button>'+
        '<button class="btn sm danger" style="min-height:20px;padding:0 4px;border:0" onclick="delProject(\''+p.id+'\')" title="删除项目"><svg><use href="#i-minus"/></svg></button></span>';
    }
    if(!ps.length) h += '<span class="muted">还没有项目，点「新增项目」。</span>';
    pbox.innerHTML=h;
  }
  if(!lbox) return;
  var mats=libMats(), out='';
  if(!mats.length){ lbox.innerHTML='<div class="empty">这里还没有素材。点「添加素材」，可粘贴扫描文字、上传图片或原稿文件。</div>'; return; }
  out += '<div class="tiny" style="margin-bottom:8px">共 '+mats.length+' 条素材 · 一份素材可同时归属多个项目，无需重复储存</div>';
  for(i=0;i<mats.length;i++){
    var mt=mats[i], pns=[];
    for(var k=0;k<(mt.projects||[]).length;k++) pns.push(projName(mt.lib, mt.projects[k]));
    out += '<div class="mat"><div class="t"><svg width="15" height="15" style="color:var(--m4)"><use href="#i-file"/></svg>'+esc(mt.title)+'</div>';
    out += '<div class="row" style="margin:5px 0">';
    for(k=0;k<pns.length;k++) out += '<span class="tag violet">'+esc(pns[k])+'</span>';
    out += '<span class="tiny">'+esc(mt.at)+'</span>';
    if(mt.analysis) out += '<span class="tag mint">已解析：'+esc(mt.analysis.genre)+'</span>';
    out += '</div>';
    if(mt.text) out += '<div class="body" id="mb-'+mt.id+'">'+esc(mt.text)+'</div>';
    if((mt.images||[]).length){
      out += '<div class="thumbs">';
      for(k=0;k<mt.images.length;k++) out += '<img src="'+mt.images[k]+'" alt="素材图" onclick="viewImg(\''+mt.id+'\','+k+')">';
      out += '</div>';
    }
    if((mt.files||[]).length){
      out += '<div class="row">';
      for(k=0;k<mt.files.length;k++) out += '<button class="fileicon" onclick="dlMatFile(\''+mt.id+'\','+k+')"><svg width="13" height="13"><use href="#i-download"/></svg>'+esc(mt.files[k].name)+'</button>';
      out += '</div>';
    }
    if((mt.links||[]).length){
      out += '<div class="row" style="margin-top:5px">';
      for(k=0;k<mt.links.length;k++) out += '<a class="btn sm s" target="_blank" rel="noopener" href="'+esc(mt.links[k].url)+'"><svg><use href="#i-link"/></svg>'+esc(mt.links[k].name||'链接')+'</a>';
      out += '</div>';
    }
    out += '<div class="row no-print" style="margin-top:8px">'+
      '<button class="btn sm v" onclick="openMatAnalysis(\''+mt.id+'\',\'\')"><svg><use href="#i-ai"/></svg>AI 解析</button>'+
      '<button class="btn sm" onclick="openMatDetail(\''+mt.id+'\')"><svg><use href="#i-eye"/></svg>详情</button>'+
      '<button class="btn sm" onclick="editMatProjects(\''+mt.id+'\')"><svg><use href="#i-folder"/></svg>归属项目</button>'+
      '<button class="btn sm" onclick="exportMatWord(\''+mt.id+'\')"><svg><use href="#i-download"/></svg>Word</button>'+
      '<button class="btn sm danger" onclick="delMat(\''+mt.id+'\')"><svg><use href="#i-trash"/></svg>删除</button></div></div>';
  }
  lbox.innerHTML=out;
}
function pickProject(id){ UI.libProject=id; renderLib(); }
function addProject(){ askPrompt('新增项目','项目名称，如：试卷 / 阅读 / 作文 / 佳词佳句','', function(v){
  DB.lib[UI.lib].projects.push({id:uid(), name:v}); save(); renderLib(); toast('项目已添加'); }); }
function renameProject(id){
  var ps=DB.lib[UI.lib].projects, p=null;
  for(var i=0;i<ps.length;i++){ if(ps[i].id===id) p=ps[i]; }
  if(!p) return;
  askPrompt('修改项目名称','项目名称', p.name, function(v){ p.name=v; save(); renderLib(); toast('已修改'); });
}
function delProject(id){
  var cnt=0, only=0, i;
  for(i=0;i<DB.lib.mats.length;i++){ var m=DB.lib.mats[i];
    if((m.projects||[]).indexOf(id)>=0){ cnt++; if(m.projects.length===1) only++; } }
  askConfirm('删除项目','该项目下有 <b>'+cnt+'</b> 条素材，其中 <b>'+only+'</b> 条仅归属本项目（删除后会变为「未分类」，内容不会丢失）。确定删除项目？', function(){
    DB.lib[UI.lib].projects=DB.lib[UI.lib].projects.filter(function(p){ return p.id!==id; });
    for(var i2=0;i2<DB.lib.mats.length;i2++){
      DB.lib.mats[i2].projects=(DB.lib.mats[i2].projects||[]).filter(function(x){ return x!==id; }); }
    if(UI.libProject===id) UI.libProject='all';
    save(); renderLib(); toast('项目已删除');
  }, '删除');
}
function clearProject(id){
  var del=0, un=0, i;
  for(i=0;i<DB.lib.mats.length;i++){ var m=DB.lib.mats[i];
    if(m.lib===UI.lib && (m.projects||[]).indexOf(id)>=0){ if(m.projects.length===1) del++; else un++; } }
  askConfirm('一键清空项目',
    '将清空「'+esc(projName(UI.lib,id))+'」下的素材：<br>· 仅属于本项目的 <b>'+del+'</b> 条将被<span class="err">彻底删除</span><br>· 与其他项目共用的 <b>'+un+'</b> 条只移除本项目归属（内容保留）<br>点击确定即刻执行。',
    function(){
      var keep=[];
      for(var i2=0;i2<DB.lib.mats.length;i2++){ var m2=DB.lib.mats[i2];
        if(m2.lib===UI.lib && (m2.projects||[]).indexOf(id)>=0){
          if(m2.projects.length===1) continue;
          m2.projects=m2.projects.filter(function(x){ return x!==id; });
        }
        keep.push(m2); }
      DB.lib.mats=keep; save(); renderLib(); toast('已清空');
    }, '确定清空');
}
</script>
<script>
/* =======================================================================
   花团锦簇 · 素材录入 / 重复比对 / 详情 / 导出
   ======================================================================= */
var MF = { imgs:[], files:[] };
function openMatForm(){
  MF.imgs=[]; MF.files=[];
  var ps=DB.lib[UI.lib].projects, i, chk='';
  if(!ps.length){ toast('请先在当前库新增一个项目'); return; }
  for(i=0;i<ps.length;i++){
    var on = (UI.libProject===ps[i].id) || (UI.libProject==='all' && i===0);
    chk += '<label class="tag" style="padding:7px 11px;cursor:pointer"><input type="checkbox" class="mf-p" value="'+ps[i].id+'"'+(on?' checked':'')+
      ' style="width:auto;margin-right:5px">'+esc(ps[i].name)+'</label>';
  }
  openModal('添加素材 · '+(UI.lib==='work'?'工作素材':'学习素材'),
    '<div class="field"><label class="fl">标题</label><input type="text" id="mf-title" placeholder="例：五年级语文期中卷（含阅读+作文）"></div>'+
    '<div class="field"><label class="fl">归属项目（可多选，一份素材多处通用，不必重复储存）</label><div class="row">'+chk+'</div></div>'+
    '<div class="field"><label class="fl">正文 / 扫描识别后的文字</label>'+
    '<textarea id="mf-text" style="min-height:130px" placeholder="可直接粘贴文字；若是纸质材料，先用手机相册或扫描 App 识别文字后粘到此处，原稿可一并上传保存"></textarea></div>'+
    '<div class="field"><label class="fl">外部链接（网站 / 软件，可添加多个，名称|网址）</label><div id="mf-links"></div>'+
    '<button class="btn sm" type="button" onclick="addLinkRow()"><svg><use href="#i-plus"/></svg>再加一个链接</button>'+
    '<div class="row"><button class="btn sm" onclick="pickMatImages()"><svg><use href="#i-image"/></svg>上传图片/扫描件</button>'+
    '<button class="btn sm" onclick="pickMatFiles()"><svg><use href="#i-upload"/></svg>上传原稿（word/pdf/excel）</button></div>'+
    '<div id="mf-thumbs" class="thumbs"></div><div id="mf-files" class="row" style="margin-top:6px"></div>'+
    '<div class="tiny" style="margin-top:9px">保存时会自动与库内已有素材比对，内容重复会先提示你对比后再决定是否储存。</div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn v" onclick="saveMat()">保存素材</button>', true);
  renderLinkRows([]);
}
function renderMFThumbs(){
  var t=$('mf-thumbs'), f=$('mf-files'); if(!t||!f) return;
  var h='', i;
  for(i=0;i<MF.imgs.length;i++) h += '<img src="'+MF.imgs[i]+'" alt="图">';
  t.innerHTML=h;
  h='';
  for(i=0;i<MF.files.length;i++) h += '<span class="fileicon"><svg width="13" height="13"><use href="#i-file"/></svg>'+esc(MF.files[i].name)+'</span>';
  f.innerHTML=h;
}
function linkRowHtml(name,url){
  return '<div class="link-row" style="display:flex;gap:6px;margin-bottom:6px"><input type="text" class="lk-name" placeholder="名称（如：学科网 / 扫描全能王）" value="'+esc(name)+'" style="flex:1;min-width:0">'+
    '<input type="text" class="lk-url" placeholder="网址 https://..." value="'+esc(url)+'" style="flex:2;min-width:0">'+
    '<button class="btn sm danger" type="button" onclick="this.parentNode.remove()"><svg><use href="#i-minus"/></svg></button></div>';
}
function renderLinkRows(links){
  var box=$('mf-links'); if(!box) return;
  var h=''; (links||[]).forEach(function(l){ h += linkRowHtml(l.name||'', l.url||''); });
  if(!(links&&links.length)) h += linkRowHtml('','');
  box.innerHTML=h;
}
function addLinkRow(){ var box=$('mf-links'); if(box) box.insertAdjacentHTML('beforeend', linkRowHtml('','')); }
function collectLinks(){
  var rows=document.querySelectorAll('.link-row'), links=[], i;
  for(i=0;i<rows.length;i++){ var n=rows[i].querySelector('.lk-name').value.trim(), u=rows[i].querySelector('.lk-url').value.trim();
    if(!n&&!u) continue;
    if(!u){ links.push({name:n,url:''}); continue; }
    if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) u='https://'+u;
    links.push({name:n||u,url:u}); }
  return links;
}
function pickMatImages(){
  pickFiles('image/*', true, function(fs){
    var n=Math.min(fs.length, 9-MF.imgs.length);
    if(n<=0){ toast('最多 9 张'); return; }
    var done=0;
    for(var i=0;i<n;i++) compressImage(fs[i], 800, function(d){ if(d) MF.imgs.push(d); done++; if(done===n) renderMFThumbs(); });
  });
}
function pickMatFiles(){
  pickFiles('.doc,.docx,.pdf,.xls,.xlsx,.csv,.txt,.ppt,.pptx', true, function(fs){
    var n=Math.min(fs.length, 5), done=0;
    for(var i=0;i<n;i++){
      (function(f){
        if(f.size > 2*1024*1024){ toast('「'+f.name+'」超过 2MB，为避免本地空间被占满已跳过；建议只存文字+图片'); done++; return; }
        var fr=new FileReader();
        fr.onload=function(){ MF.files.push({name:f.name, type:f.type, size:f.size, data:String(fr.result)}); done++; if(done>=n) renderMFThumbs(); };
        fr.onerror=function(){ done++; };
        fr.readAsDataURL(f);
      })(fs[i]);
    }
    setTimeout(renderMFThumbs, 900);
  });
}
function similarity(a,b){
  a=String(a||'').replace(/\s/g,''); b=String(b||'').replace(/\s/g,'');
  if(!a||!b) return 0;
  var setA={}, i, inter=0, uniqA=0, uniqB=0, setB={};
  for(i=0;i<a.length;i++){ if(!setA[a[i]]){ setA[a[i]]=1; uniqA++; } }
  for(i=0;i<b.length;i++){ if(!setB[b[i]]){ setB[b[i]]=1; uniqB++; if(setA[b[i]]) inter++; } }
  return inter/Math.max(1,(uniqA+uniqB-inter));
}
var PENDING_MAT=null;
function saveMat(){
  var title=$('mf-title').value.trim(), text=$('mf-text').value.trim();
  if(!title && !text){ toast('请至少填写标题或正文'); return; }
  var boxes=document.querySelectorAll('.mf-p'), pj=[], i;
  for(i=0;i<boxes.length;i++){ if(boxes[i].checked) pj.push(boxes[i].value); }
  var links=collectLinks();
  var obj={id:uid(), lib:UI.lib, projects:pj, title:title||text.slice(0,18), text:text,
    files:MF.files.slice(), images:MF.imgs.slice(), links:links, at:nowStr(), analysis:null};
  var dup=null, score=0;
  for(i=0;i<DB.lib.mats.length;i++){
    var m=DB.lib.mats[i];
    var s1=similarity(m.title, obj.title), s2=similarity(m.text, obj.text);
    var s=Math.max(s1*0.6+s2*0.4, s2);
    if(m.title===obj.title) s=1;
    if(s>score){ score=s; dup=m; }
  }
  if(dup && score>=0.62){ PENDING_MAT=obj; openDupCompare(dup, obj, score); return; }
  doSaveMat(obj);
}
function openDupCompare(oldM, newM, score){
  var pns=[]; for(var j=0;j<(oldM.projects||[]).length;j++) pns.push(projName(oldM.lib, oldM.projects[j]));
  openModal('内容重复提示 · 文件对比',
    '<div class="row" style="margin-bottom:9px"><span class="tag red">相似度约 '+Math.round(score*100)+'%</span>'+
    '<span class="tiny">库内已存在高度相似的素材，请对比后决定</span></div>'+
    '<div class="grid g2">'+
    '<div class="zone"><div class="zone-h">已存在（'+esc(oldM.at)+'）</div><div class="zone-b">'+
      '<div style="font-weight:800">'+esc(oldM.title)+'</div>'+
      '<div class="tiny">归属：'+esc(pns.join('/')||'未分类')+' · 字数 '+String(oldM.text||'').length+' · 图 '+(oldM.images||[]).length+' · 附件 '+(oldM.files||[]).length+'</div>'+
      '<div class="sep"></div><div style="font-size:14px;max-height:190px;overflow:auto">'+esc((oldM.text||'').slice(0,600))+'</div></div></div>'+
    '<div class="zone"><div class="zone-h">本次新增</div><div class="zone-b">'+
      '<div style="font-weight:800">'+esc(newM.title)+'</div>'+
      '<div class="tiny">字数 '+String(newM.text||'').length+' · 图 '+(newM.images||[]).length+' · 附件 '+(newM.files||[]).length+'</div>'+
      '<div class="sep"></div><div style="font-size:14px;max-height:190px;overflow:auto">'+esc((newM.text||'').slice(0,600))+'</div></div></div>'+
    '</div>'+

function mergeIntoOld(oldId){

  for(i=0;i<n.images.length;i++){ if((o.images||[]).length<9) o.images.push(n.images[i]); }
  for(i=0;i<n.files.length;i++) o.files.push(n.files[i]);
  for(i=0;i<n.links.length;i++) o.links.push(n.links[i]);
  if(n.text && String(o.text||'').length < n.text.length) o.text=n.text;
  o.at=nowStr();

  askConfirm('导入恢复',

    function(){ pickFiles('.json,application/json', false, function(fs){
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var j=JSON.parse(String(fr.result));

function load2fix(){
  var b=blankDB(), k;

  if(!DB.lib.work) DB.lib.work={projects:[]};

  if(!Array.isArray(DB.lib.mats)) DB.lib.mats=[];

<script>
/* ============ 云端同步（统一协议 Bearer Token + /api/*；多后端可一键切换/迁移） ============ */
// 后端类型：cb 腾讯云CloudBase / cf Cloudflare / oracle Oracle Cloud / supabase Supabase / custom 自建 / bmob Bmob云 / github GitHub Gist；leancloud 仅旧兼容
var SYNC = { backend:'cb', token:null, user:null, base:'', lcApp:'', lcKey:'', lcApi:'https://api.leancloud.cn', lcUid:'', lcObj:'', bmobApp:'', bmobKey:'', bmobUid:'', bmobObj:'', ghId:'', updatedAt:0, status:'off', pulling:false, _t:null, _iv:null, ocrAk:'', ocrSk:'', ocrTok:'', ocrExp:0 };

function loadSyncCfg(){
  try{ var s=JSON.parse(localStorage.getItem('wb_yjtjy_sync')||'{}');
    SYNC.backend=s.backend||'cb'; SYNC.token=s.token||null; SYNC.user=s.user||null;
    SYNC.base=(s.base||s.cbBase||'').replace(/\/+$/,''); SYNC.lcApp=s.lcApp||''; SYNC.lcKey=s.lcKey||'';
    SYNC.lcApi=s.lcApi||'https://api.leancloud.cn'; SYNC.lcUid=s.lcUid||''; SYNC.lcObj=s.lcObj||'';
    SYNC.bmobApp=s.bmobApp||''; SYNC.bmobKey=s.bmobKey||''; SYNC.bmobUid=s.bmobUid||''; SYNC.bmobObj=s.bmobObj||''; SYNC.ghId=s.ghId||''; SYNC.updatedAt=s.updatedAt||0;
    SYNC.ocrAk=s.ocrAk||''; SYNC.ocrSk=s.ocrSk||''; SYNC.ocrTok=s.ocrTok||''; SYNC.ocrExp=s.ocrExp||0;
  }catch(e){}
}
function saveSyncCfg(){
  try{ localStorage.setItem('wb_yjtjy_sync', JSON.stringify({backend:SYNC.backend,token:SYNC.token,user:SYNC.user,base:SYNC.base,lcApp:SYNC.lcApp,lcKey:SYNC.lcKey,lcApi:SYNC.lcApi,lcUid:SYNC.lcUid,lcObj:SYNC.lcObj,bmobApp:SYNC.bmobApp,bmobKey:SYNC.bmobKey,bmobUid:SYNC.bmobUid,bmobObj:SYNC.bmobObj,ghId:SYNC.ghId,updatedAt:SYNC.updatedAt,ocrAk:SYNC.ocrAk,ocrSk:SYNC.ocrSk,ocrTok:SYNC.ocrTok,ocrExp:SYNC.ocrExp})); }catch(e){}
}
function syncStatusText(){ return ({off:'未同步',ing:'同步中',ok:'已同步',err:'离线'}[SYNC.status]||'未同步'); }
function saveOcrCfg(){
  SYNC.ocrAk=($('ocr-ak')?$('ocr-ak').value.trim():SYNC.ocrAk)||SYNC.ocrAk;
  SYNC.ocrSk=($('ocr-sk')?$('ocr-sk').value.trim():SYNC.ocrSk)||SYNC.ocrSk;
  SYNC.ocrTok=''; SYNC.ocrExp=0; // 重置旧 token，下次 OCR 重新换取
  saveSyncCfg();
  toast((SYNC.ocrAk&&SYNC.ocrSk)?'OCR 配置已保存，可拍照识别':'已清空 OCR 配置');
}
function syncBackendName(){ return ({cb:'腾讯云CloudBase',cf:'Cloudflare',oracle:'Oracle Cloud',supabase:'Supabase',custom:'自建服务器',bmob:'Bmob 云',github:'GitHub Gist',leancloud:'LeanCloud'}[SYNC.backend]||SYNC.backend); }
function setSyncStatus(st){ SYNC.status=st; var dot=document.getElementById('sync-dot'), t=document.getElementById('sync-txt'); if(dot) dot.className='dot sync-'+st; if(t) t.textContent=syncStatusText(); }

/* ---- 统一协议后端：任意服务器地址 + Bearer Token（cb/cf/oracle/supabase/custom 通用） ---- */
// 未填服务器地址时按当前打开位置自动推断：CloudBase 网关带 /yjtjy 子路径，Cloudflare workers.dev 在根
function genBaseUrl(p){
  p=p||SYNC;
  if(p.base && p.base.trim()) return p.base.trim().replace(/\/+$/,'');
  var h=(location.hostname||'');
  if(h.indexOf('tcloudbasegateway.com')>=0) return (location.origin+(location.pathname||'')).replace(/\/+$/,'');
  return (location.origin||'').replace(/\/+$/,'');
}
function genApi(p, path, opts){ opts=opts||{}; var url=genBaseUrl(p)+path; var h={'Content-Type':'application/json'}; if(p.token) h['Authorization']='Bearer '+p.token; return fetch(url, Object.assign({headers:h, cache:'no-store'}, opts)); }
function backendBasePlaceholder(){ return ({cb:'如 https://env.api.tcloudbasegateway.com/yjtjy（留空=同源自动）',cf:'如 https://yjtjy-sync.xxx.workers.dev（留空=同源自动）',oracle:'如 http://<公网IP>:3000 或 https://oracle.example.com/yjtjy',supabase:'如 https://<project>.functions.supabase.co/yjtjy',custom:'如 https://your-server.example.com/yjtjy'}[SYNC.backend]||'服务器地址'); }
function backendBaseHint(){ return ({cb:'云函数 HTTP 访问地址；控制台「环境配置→HTTP访问服务」须关闭身份认证。数据存腾讯云数据库。',cf:'Worker 地址；数据存 Cloudflare D1。注：中国大陆网络常打不开。',oracle:'Oracle 永远免费实例上运行的 server.src.js 地址；数据存该实例本地文件/SQLite。国内可达。',supabase:'Supabase Edge Function 地址；数据存 Supabase Postgres。',custom:'任意服务器上运行的同协议后端地址；数据存该服务器。'}[SYNC.backend]||''); }
function toggleHelp(id){ var e=document.getElementById(id); if(e) e.style.display = (e.style.display==='none'?'block':'none'); }

/* ---- LeanCloud 后端 ---- */
function lcHeaders(){ var h={'Content-Type':'application/json','X-LC-Id':SYNC.lcApp,'X-LC-Key':SYNC.lcKey}; if(SYNC.token) h['X-LC-Session']=SYNC.token; return h; }
function lcApi(path, opts){ opts=opts||{}; var url=(SYNC.lcApi.replace(/\/+$/,'')||'https://api.leancloud.cn')+'/1.1'+path; return fetch(url, Object.assign({headers:lcHeaders(), cache:'no-store'}, opts)); }
function lcReadCfg(){ SYNC.lcApp=($('lc-app')?$('lc-app').value.trim():SYNC.lcApp)||SYNC.lcApp; SYNC.lcKey=($('lc-key')?$('lc-key').value.trim():SYNC.lcKey)||SYNC.lcKey; SYNC.lcApi=($('lc-api')?$('lc-api').value.trim().replace(/\/+$/,''):SYNC.lcApi)||SYNC.lcApi; }

function schedulePush(){ if(!SYNC.token) return; if(SYNC._t) clearTimeout(SYNC._t); SYNC._t=setTimeout(pushData, 800); }
function pushData(){
  if(!SYNC.token || typeof fetch!=='function') return;
  setSyncStatus('ing');
  if(SYNC.backend==='leancloud') return lcPush();
  if(SYNC.backend==='bmob') return bmobPush();
  if(SYNC.backend==='github') return githubPush();
  genApi(SYNC, '/api/data',{method:'PUT', body:JSON.stringify({blob:JSON.stringify(DB)})})
    .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
    .then(function(j){ SYNC.updatedAt=j.updatedAt||Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
    .catch(function(){ setSyncStatus('err'); });
}
function pullData(force){
  if(!SYNC.token || typeof fetch!=='function') return Promise.resolve(false);
  setSyncStatus('ing');
  if(SYNC.backend==='leancloud') return lcPull(force);
  if(SYNC.backend==='bmob') return bmobPull(force);
  if(SYNC.backend==='github') return githubPull(force);
  return genApi(SYNC, '/api/data',{method:'GET'}).then(function(r){ if(!r.ok) throw new Error('pull '+r.status); return r.json(); }).then(function(j){
    if(!force && j.updatedAt && j.updatedAt<=SYNC.updatedAt){ setSyncStatus('ok'); return false; }
    if(j.blob){ SYNC.pulling=true; try{ DB=(typeof j.blob==='string')?JSON.parse(j.blob):j.blob; }catch(e){ DB=j.blob||{}; } SYNC.updatedAt=j.updatedAt||Date.now(); saveSyncCfg(); try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} SYNC.pulling=false; if(typeof refreshAll==='function') refreshAll(); }
    setSyncStatus('ok'); return true;
  }).catch(function(){ setSyncStatus('err'); return false; });
}
function syncSignup(){
  var u=$('sync-user').value.trim(), p=$('sync-pass').value;
  if(u.length<2){ toast('用户名至少 2 字'); return; }
  if(String(p).length<4){ toast('密码至少 4 位'); return; }
  if(SYNC.backend==='leancloud') return lcSignup(u,p);
  if(SYNC.backend==='bmob') return bmobSignup(u,p);
  SYNC.base=($('sync-base')?$('sync-base').value.trim().replace(/\/+$/,''):SYNC.base)||SYNC.base;
  genApi(SYNC, '/api/signup',{method:'POST',body:JSON.stringify({username:u,password:p})})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'注册失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.token; SYNC.user=j.user; SYNC.base=($('sync-base').value.trim().replace(/\/+$/,'')||SYNC.base); saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('注册成功，已登录'); return pullData(true); })
    .then(function(){ pushData(); })
    .catch(function(e){ toast(e.message||'注册失败'); });
}
function syncLogin(){
  var u=$('sync-user').value.trim(), p=$('sync-pass').value;
  if(SYNC.backend==='leancloud') return lcLogin(u,p);
  if(SYNC.backend==='bmob') return bmobLogin(u,p);
  SYNC.base=($('sync-base')?$('sync-base').value.trim().replace(/\/+$/,''):SYNC.base)||SYNC.base;
  genApi(SYNC, '/api/login',{method:'POST',body:JSON.stringify({username:u,password:p})})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'登录失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.token; SYNC.user=j.user; SYNC.base=($('sync-base').value.trim().replace(/\/+$/,'')||SYNC.base); saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('登录成功'); return pullData(true); })
    .then(function(){ pushData(); })
    .catch(function(e){ toast(e.message||'登录失败'); });
}
function syncLogout(){ SYNC.token=null; SYNC.user=null; SYNC.lcUid=''; SYNC.lcObj=''; SYNC.bmobUid=''; SYNC.bmobObj=''; SYNC.ghId=''; saveSyncCfg(); setSyncStatus('off'); openSettings(); toast('已退出登录'); }
function syncNow(){ if(!SYNC.token){ toast('请先登录'); return; } pullData(true).then(function(){ pushData(); }); }

/* ---- LeanCloud 实现 ---- */
function lcSignup(u,p){
  lcReadCfg();
  if(!SYNC.lcApp||!SYNC.lcKey){ toast('请填写 LeanCloud 的 App ID 与 Client Key'); return; }
  lcApi('/users',{method:'POST',body:JSON.stringify({username:u,password:p})})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'注册失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.sessionToken; SYNC.user=j.username; SYNC.lcUid=j.objectId; SYNC.lcObj=''; saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('注册成功，已登录'); return lcPull(true); })
    .then(function(){ lcPush(); })
    .catch(function(e){ toast(e.message||'注册失败'); });
}
function lcLogin(u,p){
  lcReadCfg();
  if(!SYNC.lcApp||!SYNC.lcKey){ toast('请填写 LeanCloud 的 App ID 与 Client Key'); return; }
  lcApi('/login?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p),{method:'POST'})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'登录失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.sessionToken; SYNC.user=j.username; SYNC.lcUid=j.objectId; SYNC.lcObj=''; saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('登录成功'); return lcPull(true); })
    .then(function(){ lcPush(); })
    .catch(function(e){ toast(e.message||'登录失败'); });
}
function lcPush(){
  if(!SYNC.lcObj){
    var acl={}; acl[SYNC.lcUid]={read:true,write:true};
    lcApi('/classes/Workbench',{method:'POST',body:JSON.stringify({owner:SYNC.user, blob:DB, ACL:acl})})
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(j){ SYNC.lcObj=j.objectId; SYNC.updatedAt=Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  } else {
    lcApi('/classes/Workbench/'+SYNC.lcObj,{method:'PUT',body:JSON.stringify({blob:DB})})
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(){ SYNC.updatedAt=Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  }
}
function lcPull(force){
  return lcApi('/classes/Workbench?where='+encodeURIComponent(JSON.stringify({owner:SYNC.user})),{method:'GET'})
    .then(function(r){ if(!r.ok) throw new Error('pull '+r.status); return r.json(); })
    .then(function(j){
      var res=(j.results||[])[0];
      if(!res){ setSyncStatus('ok'); return false; }
      var upd=new Date(res.updatedAt).getTime();
      if(!force && upd && upd<=SYNC.updatedAt){ setSyncStatus('ok'); return false; }
      SYNC.lcObj=res.objectId; SYNC.updatedAt=upd||Date.now(); SYNC.pulling=true; DB=res.blob; saveSyncCfg();
      try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} SYNC.pulling=false; if(typeof refreshAll==='function') refreshAll();
      setSyncStatus('ok'); return true;
    }).catch(function(){ setSyncStatus('err'); return false; });
}
/* ---- Bmob 云后端 ---- */
function bmHeaders(session){
  var h={'Content-Type':'application/json','X-Bmob-Application-Id':SYNC.bmobApp,'X-Bmob-REST-API-Key':SYNC.bmobKey};
  if(session) h['X-Bmob-Session-Token']=session;
  return h;
}
function bmApi(path, opts, session){ opts=opts||{}; return fetch('https://api2.bmob.cn/1'+path, Object.assign({headers:bmHeaders(session), cache:'no-store'}, opts)); }
function bmReadCfg(){ SYNC.bmobApp=($('bm-app')?$('bm-app').value.trim():SYNC.bmobApp)||SYNC.bmobApp; SYNC.bmobKey=($('bm-key')?$('bm-key').value.trim():SYNC.bmobKey)||SYNC.bmobKey; }
function bmobSignup(u,p){
  bmReadCfg();
  if(!SYNC.bmobApp||!SYNC.bmobKey){ toast('请填写 Bmob 的 Application ID 与 REST API Key'); return; }
  bmApi('/users',{method:'POST',body:JSON.stringify({username:u,password:p})})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'注册失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.sessionToken; SYNC.user=j.username; SYNC.bmobUid=j.objectId; SYNC.bmobObj=''; saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('注册成功，已登录'); return bmobPull(true); })
    .then(function(){ bmobPush(); })
    .catch(function(e){ toast(e.message||'注册失败'); });
}
function bmobLogin(u,p){
  bmReadCfg();
  if(!SYNC.bmobApp||!SYNC.bmobKey){ toast('请填写 Bmob 的 Application ID 与 REST API Key'); return; }
  bmApi('/login?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p),{method:'POST'})
    .then(function(r){ if(!r.ok) return r.json().then(function(x){ throw new Error(x.error||'登录失败'); }); return r.json(); })
    .then(function(j){ SYNC.token=j.sessionToken; SYNC.user=j.username; SYNC.bmobUid=j.objectId; SYNC.bmobObj=''; saveSyncCfg(); setSyncStatus('ok'); openSettings(); toast('登录成功'); return bmobPull(true); })
    .then(function(){ bmobPush(); })
    .catch(function(e){ toast(e.message||'登录失败'); });
}
function bmobPush(){
  if(!SYNC.bmobObj){
    var acl={}; acl[SYNC.bmobUid]={read:true,write:true};
    bmApi('/classes/Workbench',{method:'POST',body:JSON.stringify({owner:SYNC.user, blob:DB, ACL:acl})}, SYNC.token)
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(j){ SYNC.bmobObj=j.objectId; SYNC.updatedAt=Date.parse(j.updatedAt)||Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  } else {
    bmApi('/classes/Workbench/'+SYNC.bmobObj,{method:'PUT',body:JSON.stringify({blob:DB})}, SYNC.token)
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(){ SYNC.updatedAt=Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  }
}
function bmobPull(force){
  return bmApi('/classes/Workbench?where='+encodeURIComponent(JSON.stringify({owner:SYNC.user})),{method:'GET'}, SYNC.token).then(function(r){ if(!r.ok) throw new Error('pull '+r.status); return r.json(); }).then(function(j){
    var res=(j.results||[])[0];
    if(!res){ setSyncStatus('ok'); return false; }
    var upd=Date.parse(res.updatedAt)||Date.now();
    if(!force && upd && upd<=SYNC.updatedAt){ setSyncStatus('ok'); return false; }
    SYNC.bmobObj=res.objectId; SYNC.updatedAt=upd; SYNC.pulling=true; DB=res.blob; saveSyncCfg();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} SYNC.pulling=false; if(typeof refreshAll==='function') refreshAll();
    setSyncStatus('ok'); return true;
  }).catch(function(){ setSyncStatus('err'); return false; });
}
/* ---- GitHub Gist 后端 ---- */
function ghHeaders(){ return {'Content-Type':'application/json','Authorization':'Bearer '+SYNC.token}; }
function ghApi(path, opts){ opts=opts||{}; return fetch('https://api.github.com'+path, Object.assign({headers:ghHeaders(), cache:'no-store'}, opts)); }
function githubPush(){
  if(!SYNC.token) return;
  setSyncStatus('ing');
  var content=JSON.stringify(DB);
  if(!SYNC.ghId){
    ghApi('/gists',{method:'POST',body:JSON.stringify({description:'幽径通骄阳工作台数据', public:false, files:{'yjtjy-data.json':{content:content}}})})
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(j){ SYNC.ghId=j.id; SYNC.updatedAt=Date.parse(j.updated_at)||Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  } else {
    ghApi('/gists/'+SYNC.ghId,{method:'PATCH',body:JSON.stringify({files:{'yjtjy-data.json':{content:content}}})})
      .then(function(r){ if(!r.ok) throw new Error('push '+r.status); return r.json(); })
      .then(function(j){ SYNC.updatedAt=Date.parse(j.updated_at)||Date.now(); saveSyncCfg(); setSyncStatus('ok'); })
      .catch(function(){ setSyncStatus('err'); });
  }
}
function githubPull(force){
  if(!SYNC.token || !SYNC.ghId) return Promise.resolve(false);
  setSyncStatus('ing');
  return ghApi('/gists/'+SYNC.ghId,{method:'GET'}).then(function(r){ if(!r.ok) throw new Error('pull '+r.status); return r.json(); }).then(function(j){
    var f=j.files&&j.files['yjtjy-data.json'];
    if(!f||!f.content){ setSyncStatus('ok'); return false; }
    var upd=Date.parse(j.updated_at)||Date.now();
    if(!force && upd && upd<=SYNC.updatedAt){ setSyncStatus('ok'); return false; }
    SYNC.pulling=true; try{ DB=JSON.parse(f.content); }catch(e){} SYNC.updatedAt=upd; saveSyncCfg();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} SYNC.pulling=false; if(typeof refreshAll==='function') refreshAll();
    setSyncStatus('ok'); return true;
  }).catch(function(){ setSyncStatus('err'); return false; });
}
function githubConnect(){
  SYNC.token=($('sync-token')?$('sync-token').value.trim():SYNC.token)||SYNC.token;
  if(!SYNC.token){ toast('请填写 GitHub Token（需 gist 权限）'); return; }
  saveSyncCfg(); setSyncStatus('ok'); openSettings();
  ghApi('/gists?per_page=100',{method:'GET'}).then(function(r){ if(!r.ok) throw new Error('list '+r.status); return r.json(); }).then(function(list){
    var found=(list||[]).find(function(g){ return g.description==='幽径通骄阳工作台数据' && g.files && g.files['yjtjy-data.json']; });
    if(found){ SYNC.ghId=found.id; saveSyncCfg(); return githubPull(true); }
    return githubPush();
  }).catch(function(){ githubPush(); });
}
/* ---- 一键迁移：把当前数据复制到目标服务器并切换 ---- */
function migrateData(){
  var tb=$('mig-base').value.trim().replace(/\/+$/,'');
  var tu=$('mig-user').value.trim();
  var tp=$('mig-pass').value;
  var tt=$('mig-type')?$('mig-type').value:'custom';
  if(!tb){ toast('请填写目标服务器地址'); return; }
  if(tu.length<2 || String(tp).length<4){ toast('目标账号：用户名≥2字，密码≥4位'); return; }
  var tgt={ base:tb, token:null, user:null };
  setSyncStatus('ing');
  genApi(tgt, '/api/login',{method:'POST',body:JSON.stringify({username:tu,password:tp})})
    .then(function(r){ if(r.ok) return r.json();
      // 目标服务器无此账号时自动注册（仅在登录失败、且账号名未被占用时安全）
      return genApi(tgt,'/api/signup',{method:'POST',body:JSON.stringify({username:tu,password:tp})}).then(function(rr){ if(!rr.ok) return rr.json().then(function(x){ throw new Error(x.error||'目标服务器登录/注册失败'); }); return rr.json(); });
    })
    .then(function(j){ tgt.token=j.token; tgt.user=j.username;
      return genApi(tgt,'/api/data',{method:'PUT', body:JSON.stringify({blob:JSON.stringify(DB)})}); })
    .then(function(r){ if(!r.ok) throw new Error('写入目标服务器失败 '+r.status); return r.json(); })
    .then(function(){
      SYNC.backend=tt; SYNC.base=tb; SYNC.token=tgt.token; SYNC.user=tgt.user; SYNC.updatedAt=Date.now(); saveSyncCfg(); setSyncStatus('ok');
      openSettings(); toast('迁移完成，已切换到新服务器'); 
    })
    .catch(function(e){ setSyncStatus('err'); toast(e.message||'迁移失败'); });
}

function setupPWA(){
  // APK / WebView 本地环境：已是 App 形态，无需「安装到主屏」提示，直接隐藏
  if(location.href.indexOf('android_asset')>=0){ var _t=document.getElementById('installTip'); if(_t) _t.style.display='none'; return; }
  try{
    var manifest={name:'幽径通骄阳 · 学习工作台',short_name:'幽径通骄阳',start_url:'.',display:'standalone',orientation:'portrait',background_color:'#FFFDF7',theme_color:'#FF6B35',icons:[{src:PWA_ICON,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
    var url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    var l=document.createElement('link'); l.rel='manifest'; l.href=url; document.head.appendChild(l);
  }catch(e){}
  try{
    var standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(localStorage.getItem('wb_yjtjy_noPwaTip')==='1') return;
    var tip=document.getElementById('installTip'); if(!tip) return;
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    tip.querySelector('.tip-txt').innerHTML = ios
      ? '点 Safari 底部 <b>分享</b> 图标 → <b>添加到主屏幕</b>，即可像 App 一样全屏使用'
      : '点浏览器右上角 <b>⋮</b> → <b>安装应用 / 添加到主屏幕</b>，即可像 App 一样全屏使用';
    tip.classList.add('show');
  }catch(e){}
}
function closePwaTip(){ var t=document.getElementById('installTip'); if(t) t.classList.remove('show'); try{localStorage.setItem('wb_yjtjy_noPwaTip','1');}catch(e){} }
function initSync(){
  setupPWA();
  loadSyncCfg();
  // 同源打开时自动把 API 地址设为当前页地址（CloudBase 网关带 /yjtjy 子路径，Cloudflare workers.dev 在根），免填、免 CORS
  if(SYNC.backend!=='leancloud' && !SYNC.base && location.hostname){
    if(location.hostname.indexOf('tcloudbasegateway.com')>=0){ SYNC.base=(location.origin+(location.pathname||'')).replace(/\/+$/,''); saveSyncCfg(); }
    else if(location.hostname.indexOf('workers.dev')>=0){ SYNC.base=location.origin; saveSyncCfg(); }
  }
  setSyncStatus(SYNC.token?'ok':'off');
  if(SYNC.token) pullData(true).then(function(){ pushData(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && SYNC.token) pullData(); });
  if(SYNC._iv) clearInterval(SYNC._iv);
  SYNC._iv=setInterval(function(){ if(SYNC.token && !document.hidden) pullData(); }, 30000);
}
if(document.readyState!=='loading') initSync(); else document.addEventListener('DOMContentLoaded', initSync);
