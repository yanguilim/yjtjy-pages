<title>幽径通骄阳 · 学习工作台</title>
<style>
/* ============ 设计令牌：多巴胺色系 × 古风宣纸 ============ */
:root{
  --paper:#FFFDF7; --paper2:#FFF8ED; --ink:#2B2118; --ink2:#5C4B3A; --ink3:#8B7A66;
  --line:#EADFCD; --line2:#F3EADB;
  --dop-rose:#FF4D6D; --dop-amber:#FFB703; --dop-mint:#06D6A0; --dop-sky:#4CC9F0;
  --dop-violet:#9D4EDD; --dop-orange:#FF6B35; --dop-jade:#06A77D;
  --red:#E5383B; --green:#1B9C5B; --blue:#1D6FE0;
  --m1:#FFB703; --m2:#06A77D; --m3:#FF6B35; --m4:#9D4EDD;
  --shadow:0 6px 22px rgba(90,60,20,.09); --shadow2:0 12px 40px rgba(90,60,20,.16);
  --r:16px; --r2:12px; --r3:999px;
  --fs:"KaiTi","STKaiti","Kaiti SC",serif;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff); color:var(--ink); background:var(--paper);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,183,3,.13), transparent 42%),
    radial-gradient(circle at 88% 4%, rgba(157,78,221,.11), transparent 40%),
    radial-gradient(circle at 78% 92%, rgba(6,214,160,.12), transparent 44%),
    radial-gradient(circle at 8% 88%, rgba(76,201,240,.11), transparent 40%);
  background-attachment:fixed; font-size:15px; line-height:1.65;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
body.glucose-alarm{background-color:#FFECEC}
body.glucose-alarm::before{content:"";position:fixed;inset:0;border:6px solid rgba(229,56,59,.55);pointer-events:none;z-index:60;animation:alarmPulse 1.4s ease-in-out infinite}
@keyframes alarmPulse{0%,100%{opacity:.35}50%{opacity:.9}}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue)}
.hide{display:none !important}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,253,247,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-badge{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--dop-amber),var(--dop-orange));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:0 0 auto}
.brand h1{margin:0;font-family:var(--fs);font-size:23px;letter-spacing:3px;font-weight:700;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink3);letter-spacing:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r3);background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.stat-chip b{color:var(--dop-rose)}

/* ============ 导航 ============ */
.nav{max-width:1180px;margin:12px auto 0;padding:0 14px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--r3);background:#fff;border:1px solid var(--line);font-size:15px;font-weight:700;color:var(--ink2);min-height:44px;transition:.18s}
.nav button svg{width:18px;height:18px}
.nav button.on{color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.nav button.on[data-m="dash"]{background:linear-gradient(135deg,#FFC53D,var(--m1))}
.nav button.on[data-m="path"]{background:linear-gradient(135deg,#2ED8A7,var(--m2))}
.nav button.on[data-m="sun"]{background:linear-gradient(135deg,#FF8F5E,var(--m3))}
.nav button.on[data-m="lib"]{background:linear-gradient(135deg,#B57BEA,var(--m4))}

/* ============ 布局 ============ */
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.card-h h2,.card-h h3{margin:0;font-size:17px;font-family:var(--fs);letter-spacing:1.5px;font-weight:700}
.card-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink3);font-size:13px}
.tiny{font-size:12px;color:var(--ink3)}
.sep{height:1px;background:var(--line2);margin:12px 0}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:var(--r3);background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--ink2);transition:.16s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn svg{width:16px;height:16px}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.sm svg{width:14px;height:14px}
.btn.p{background:linear-gradient(135deg,#FF7A93,var(--dop-rose));color:#fff;border-color:transparent}
.btn.a{background:linear-gradient(135deg,#FFC53D,var(--dop-amber));color:#5C3D00;border-color:transparent}
.btn.g{background:linear-gradient(135deg,#2ED8A7,var(--dop-jade));color:#fff;border-color:transparent}
.btn.s{background:linear-gradient(135deg,#7FDBFF,var(--dop-sky));color:#03384A;border-color:transparent}
.btn.v{background:linear-gradient(135deg,#B57BEA,var(--dop-violet));color:#fff;border-color:transparent}
.btn.o{background:linear-gradient(135deg,#FF9A6C,var(--dop-orange));color:#fff;border-color:transparent}
.btn.danger{border-color:#F6C4C5;color:var(--red)}
.btn.danger:hover{background:#FFF1F1}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ 表单 ============ */
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r2);background:#FFFEFA;font-size:16px;outline:none;transition:.16s}
input:focus,select:focus,textarea:focus{border-color:var(--dop-amber);box-shadow:0 0 0 3px rgba(255,183,3,.16)}
textarea{resize:vertical;min-height:76px;line-height:1.7}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 5px}
.field{margin-bottom:11px}
.inline-form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}

/* ============ 标签 / 徽章 ============ */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r3);font-size:12px;font-weight:700;background:var(--paper2);border:1px solid var(--line);color:var(--ink2)}
.tag.rose{background:#FFEDF1;border-color:#FFC9D6;color:#C81E45}
.tag.amber{background:#FFF6DF;border-color:#FFE1A3;color:#8A5B00}
.tag.mint{background:#E3FBF3;border-color:#A9EEDA;color:#046B51}
.tag.sky{background:#E7F7FE;border-color:#B3E7F8;color:#0A6081}
.tag.violet{background:#F5EDFE;border-color:#DEC7F7;color:#6423A8}
.tag.red{background:#FFECEC;border-color:#F8C6C7;color:#B4262A}
.err{color:var(--red);font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r3);background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer}
.sync-chip .dot{margin-right:2px}
.sync-off{background:#bbb}.sync-ing{background:#F4A261;animation:pulse 1s infinite}.sync-ok{background:#06A77D}.sync-err{background:#E5383B}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============ 今天要处理 ============ */
.today{background:linear-gradient(135deg,#FFF7E3,#FFEFF3);border:1.5px solid #FFDCA8;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.today h2{margin:0;font-family:var(--fs);font-size:18px;letter-spacing:2px}
.tl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.tl li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r2);flex-wrap:wrap}
.tl li.over{border-color:#F6C4C5;background:#FFF6F6}
.tl li .t{flex:1;min-width:140px}
.tl li.done .t{text-decoration:line-through;color:var(--ink3)}
.chk{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--dop-mint);border-color:var(--dop-mint)}
.chk svg{width:15px;height:15px;color:#fff;opacity:0}
.chk.on svg{opacity:1}

/* ============ 列表 / 条目 ============ */
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r2);background:#FFFEFB;margin-bottom:8px;flex-wrap:wrap}
.item .grow{flex:1;min-width:150px}
.item .ops{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);border:2px dashed var(--line);border-radius:var(--r2);background:#FFFEFA;font-size:14px}

/* ============ 学生名单 ============ */
.stu-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.stu{position:relative;display:flex;flex-direction:column;gap:4px;padding:13px;border-radius:var(--r2);border:1.5px solid var(--line);background:#fff;text-align:left;min-height:76px;transition:.16s}
.stu:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stu .nm{font-size:17px;font-weight:800;font-family:var(--fs);letter-spacing:1px;display:flex;align-items:center;gap:5px}
.stu.warn .nm{color:var(--blue)}
.stu .mt{font-size:12px;color:var(--ink3)}
.flower{width:19px;height:19px;flex:0 0 auto}
.card-hero{border-radius:var(--r);padding:20px 18px;color:#fff;background:linear-gradient(135deg,#2ED8A7 0%,#06A77D 50%,#0B8B93 100%);box-shadow:var(--shadow2);margin-bottom:14px;min-height:20vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.card-hero::after{content:"";position:absolute;right:-28px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13)}
.card-hero h2{margin:0;font-family:var(--fs);font-size:27px;letter-spacing:4px}
.hero-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.19);border-radius:var(--r2);padding:7px 13px;font-size:13px;font-weight:700}
.hero-stats b{font-size:19px;display:block;line-height:1.2}

/* ============ 展示台栏目 ============ */
.zone{border:1.5px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#fff;margin-bottom:12px}
.zone-h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper2);border-bottom:1px solid var(--line);font-weight:800;font-size:15px;flex-wrap:wrap}
.zone-h .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.zone-b{padding:12px}
.rec{padding:9px 11px;border-radius:10px;background:#FFFEFA;border:1px solid var(--line2);margin-bottom:7px;font-size:15px;line-height:1.9}
.rec .meta{font-size:11px;color:var(--ink3);margin-top:3px}
/* ============ 进修展示台（项目并列 + 竖排详情） ============ */
.study-cols{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){ .study-cols{grid-template-columns:repeat(2,1fr)} }
@media(max-width:680px){ .study-cols{grid-template-columns:1fr} }
.study-name{background:none;border:0;padding:0;margin:0;font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;text-align:left}
.study-name:hover{color:var(--m4);text-decoration:underline}
.study-col .card-h{align-items:flex-start}
.study-rec{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.study-rec-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.study-rec-h .tiny{font-weight:700;color:var(--ink2)}

/* ============ 模态框 ============ */
.mask{position:fixed;inset:0;background:rgba(43,33,24,.5);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:var(--paper);border-radius:var(--r);width:100%;max-width:560px;box-shadow:var(--shadow2);max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{max-width:880px}
.modal-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px;font-family:var(--fs);letter-spacing:1.5px}
.modal-h button{margin-left:auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.modal-b{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ============ 搜索结果 ============ */
.sr{padding:11px 12px;border-radius:var(--r2);border:1px solid var(--line);background:#fff;margin-bottom:8px}
.sr .p{font-size:12px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.sr .txt{font-size:14px;line-height:1.7}
mark{background:#FFF08A;color:inherit;padding:0 2px;border-radius:3px;font-weight:700}

/* ============ 数据看板 ============ */
.kpi{border-radius:var(--r2);padding:13px;border:1.5px solid var(--line);background:#fff;text-align:center}
.kpi .v{font-size:24px;font-weight:800;line-height:1.25}
.kpi .l{font-size:12px;color:var(--ink3);font-weight:700}
.bar{height:9px;border-radius:var(--r3);background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r3);background:linear-gradient(90deg,var(--dop-mint),var(--dop-sky))}
.chartbox{width:100%;overflow-x:auto}

/* ============ 素材卡 ============ */
.mat{border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;padding:12px;margin-bottom:9px}
.mat .t{font-weight:800;font-size:15px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mat .body{font-size:14px;color:var(--ink2);margin:6px 0;max-height:80px;overflow:hidden;position:relative;line-height:1.75}
.mat .body.open{max-height:none}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.fileicon{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;background:var(--paper2);border:1px solid var(--line);font-size:12px;font-weight:700}

/* ============ 烟花 / 小红花动画 ============ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;animation:fly 1.15s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#FFF6E0;padding:11px 20px;border-radius:var(--r3);font-size:14px;font-weight:700;z-index:95;box-shadow:var(--shadow2);max-width:88vw;text-align:center}

/* ============ 门禁 ============ */
.lock{max-width:420px;margin:32px auto;text-align:center}
.lock .ring{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#FF9A6C,var(--dop-orange));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow2)}
.pin{display:flex;gap:9px;justify-content:center;margin:14px 0}
.pin input{width:44px;height:54px;text-align:center;font-size:23px;font-weight:800;padding:0}

/* ============ 移动端 ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;background:rgba(255,253,247,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:56px;font-size:11px;font-weight:700;color:var(--ink3)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on[data-m="dash"]{color:var(--m1)}
.tabbar button.on[data-m="path"]{color:var(--m2)}
.tabbar button.on[data-m="sun"]{color:var(--m3)}
.tabbar button.on[data-m="lib"]{color:var(--m4)}
@media(max-width:900px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .nav{display:none}
  .tabbar{display:block}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .brand h1{font-size:19px;letter-spacing:2px}
  .wrap{padding:11px}
  .card{padding:13px;border-radius:14px}
  .topbar-actions{width:100%;margin-left:0}
  .topbar-actions .btn{flex:1}
  .card-hero h2{font-size:22px}
  .stu-grid{grid-template-columns:repeat(2,1fr)}
  .btn{min-height:44px}
}
/* ============ PWA 安装引导 ============ */
.install-tip{display:none;position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:96;background:linear-gradient(135deg,#FFB703,#FF6B35);color:#3a2410;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow2);gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;max-width:520px;margin:0 auto}
.install-tip.show{display:flex}
.install-tip b{color:#5a2a00}
.install-tip .x{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.12);color:#3a2410;font-weight:800;font-size:16px;line-height:1}
.install-tip svg{width:22px;height:22px;flex:none;margin-top:1px;stroke:#3a2410}
@media(min-width:769px){ .install-tip{display:none !important} }
.topbar{padding-top:max(12px, env(safe-area-inset-top))}

<script>
/* =======================================================================
   幽径通骄阳 · 学习工作台
   架构分层（单向调用，禁止渲染函数互调）：
   数据层 store  →  计算层 calc  →  渲染层 render*  →  统一入口 refreshAll()
   ======================================================================= */
'use strict';
var KEY = 'wb_yjtjy_v1';
var DB = null;
var UI = { module:'dash', stuId:null, sunPanel:null, lib:'work', libProject:'all', sunUnlocked:false, memoImgs:[], pendingAnalysis:null };
var ZONES = [
  {k:'dictation', n:'听写', c:'var(--dop-rose)'},
  {k:'recite',    n:'背诵', c:'var(--dop-amber)'},
  {k:'write',     n:'默写', c:'var(--dop-jade)'},
  {k:'annot',     n:'注释', c:'var(--dop-sky)'}
];
var SUNP = [

/* ============ 基础工具 ============ */
function $(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowStr(){ var d=new Date(); return todayStr()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function dStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shiftDay(str, n){ var p=String(str).split('-'); var d=new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return dStr(d); }
function dayDiff(a,b){ var pa=String(a).split('-'), pb=String(b).split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((da-db)/86400000); }
function cnDate(str){ if(!str) return ''; var p=String(str).split(' ')[0].split('-'); return p.length<3?str:(p[1]+'月'+p[2]+'日'); }
function monthKey(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }

function toast(msg, ms){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.remove(); }, ms||2400);
}
function download(name, content, mime){
  var blob = content instanceof Blob ? content : new Blob(['\ufeff'+content], {type:(mime||'text/plain')+';charset=utf-8'});
  var a=document.createElement('a'), url=URL.createObjectURL(blob);
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* ============ 特效 ============ */
function boom(n, colors){
  var box=$('fx'); if(!box) return;
  var cx=window.innerWidth/2, cy=window.innerHeight*0.36;
  var cs = colors || ['#FF4D6D','#FFB703','#06D6A0','#4CC9F0','#9D4EDD','#FF6B35'];
  for(var i=0;i<(n||34);i++){
    var s=document.createElement('i'); s.className='spark';
    var ang=Math.random()*Math.PI*2, dist=90+Math.random()*180;
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.background=cs[i%cs.length];
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    s.style.animationDelay=(Math.random()*0.25)+'s';
    box.appendChild(s);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.remove(); }, 1600); })(s);
  }
}

function openModal(title, bodyHtml, footHtml, wide){
  var root=$('modal-root'); if(!root) return;
  root.innerHTML =
    '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal'+(wide?' wide':'')+'">'+
    '<div class="modal-h"><svg width="18" height="18" style="color:var(--dop-amber)"><use href="#i-star"/></svg><h3>'+esc(title)+'</h3>'+
    '<button onclick="closeModal()" aria-label="关闭"><svg width="20" height="20"><use href="#i-close"/></svg></button></div>'+
    '<div class="modal-b">'+bodyHtml+'</div>'+
    (footHtml?'<div class="modal-f">'+footHtml+'</div>':'')+'</div></div>';
}
function closeModal(){ var r=$('modal-root'); if(r) r.innerHTML=''; }
var _confirmCb=null;
function askConfirm(title, msg, cb, okText){
  _confirmCb = cb;
  openModal(title,
    '<div style="font-size:15px;line-height:1.85">'+msg+'</div>',
    '<button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn p" onclick="runConfirm()">'+esc(okText||'确定')+'</button>');
}
function runConfirm(){ var cb=_confirmCb; _confirmCb=null; closeModal(); if(typeof cb==='function') cb(); }
function askPrompt(title, label, def, cb){
  _confirmCb = function(){ };
  openModal(title,
    '<div class="field"><label class="fl">'+esc(label)+'</label><input type="text" id="prompt-in" value="'+esc(def||'')+'"></div>',
    '<button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn g" id="prompt-ok">确定</button>');
  var ok=$('prompt-ok'), inp=$('prompt-in');
  if(inp){ inp.focus(); inp.onkeydown=function(e){ if(e.key==='Enter' && ok) ok.click(); }; }
  if(ok) ok.onclick=function(){ var v=inp?inp.value.trim():''; closeModal(); if(v) cb(v); };
}

function studyProjName(id){ var ps=DB.study.projects; for(var i=0;i<ps.length;i++){ if(ps[i].id===id) return ps[i].name; } return '未分类'; }

function errCount(sid){

}

  for(i=0;i<SUNP.length;i++){ var p=SUNP[i], arr=DB.health[p.k]||[];
    for(j=0;j<arr.length;j++){ var a=arr[j];
      ix.push({mod:'骄阳永灿', pos:p.n+'展示台', text:p.n+' '+a.val+(p.unit==='内容'?'':(' '+p.unit))+(a.note?('　'+a.note):''),
        time:a.y+'-'+pad(a.m)+'-'+pad(a.d)+' '+(a.t||''), go:['sun',p.k], lock:true}); } }
  for(i=0;i<DB.study.items.length;i++){ var it=DB.study.items[i];

      text:mt.title+'　'+(mt.text||''), time:mt.at, go:['mat',mt.id]}); }
  return ix;
}
function doSearch(q){

  return out;
}
function hl(text, q){

}

function scoreHit(text, words){ var n=0; for(var i=0;i<words.length;i++){ if(text.indexOf(words[i])>=0) n++; } return n; }
function analyzeArticle(text){
  var t=String(text||''), res={genre:'', genreScore:{}, desc:[], rhet:[], skill:[], advice:[], qtypes:[]};
  if(t.length<8){ res.genre='文本过短，暂无法判定'; return res; }
  var sc={ '记叙文':scoreHit(t,LEX.narr), '议论文':scoreHit(t,LEX.argu)*1.2, '说明文':scoreHit(t,LEX.expo)*1.1, '抒情散文':scoreHit(t,LEX.lyric)*1.3 };
  res.genreScore=sc;
  var best='记叙文', bv=-1, k;
  for(k in sc){ if(sc[k]>bv){ bv=sc[k]; best=k; } }
  res.genre = bv<=0 ? '记叙文（特征不明显，按叙事文本处理）' : best;
  var i;
  if(res.genre.indexOf('记叙')>=0 || res.genre.indexOf('抒情')>=0){
    for(i=0;i<LEX.desc.length;i++){ if(scoreHit(t,LEX.desc[i][1])>=1) res.desc.push(LEX.desc[i][0]); }
  }
  for(i=0;i<LEX.rhet.length;i++){ var name=LEX.rhet[i][0], hits=scoreHit(t,LEX.rhet[i][1]);
    if(name==='排比'&&hits<3) continue;
    if(name==='对偶') continue;
    if(name==='设问'&&t.indexOf('？')<0) continue;
    if(hits>=1) res.rhet.push(name); }
  for(i=0;i<LEX.skill.length;i++){ if(scoreHit(t,LEX.skill[i][1])>=2) res.skill.push(LEX.skill[i][0]); }
  if(res.genre.indexOf('记叙')>=0||res.genre.indexOf('抒情')>=0){
    res.qtypes=['词句赏析题（修辞+内容+情感三段式）','人物形象概括题','段落作用题（内容+结构）','标题含义与作用题','情感变化梳理题'];
    res.advice=['赏析句子按「手法 → 写出了什么 → 表达了什么情感」三步作答，缺一步就扣分。',
      '概括人物形象要「性格词 + 文中依据」成对出现，不能只写性格词。',
      '段落作用分内容与结构两条线：内容写什么，结构上承上启下/铺垫/照应。'];
  }else if(res.genre.indexOf('议论')>=0){
    res.qtypes=['中心论点提炼题','论证方法及作用题','论据补充与替换题','段落顺序能否调换题','议论语言分析题'];
    res.advice=['先圈出首段末句与末段首句，中心论点常在此二处。',
      '论证方法答题模板：举例/道理/对比/比喻论证 + 具体论证了什么 + 使论证更有力。',
      '补写论据要与论点同向、体裁一致（名人事例优先）。'];
  }else{
    res.qtypes=['说明对象及特征题','说明方法及作用题','说明顺序题','说明语言准确性题'];
    res.advice=['说明方法要精确命名：举例子、列数字、作比较、打比方、分类别、下定义。',
      '「大约」「左右」这类词考查语言准确性，答题要点是「体现说明的科学严谨」。'];
  }
  if(!res.rhet.length) res.rhet.push('未检出显著修辞（可人工复核）');
  return res;
}
/* 速记分析：识别学生 / 栏目 / 错字 / 健康数值 / 待办 / 素材 */
function analyzeMemoText(raw){
  var t=String(raw||'').trim(), sug=[], i, j;
  if(!t) return sug;
  // 学生识别
  var stu=null;
  for(i=0;i<DB.students.length;i++){ if(t.indexOf(DB.students[i].name)>=0){ stu=DB.students[i]; break; } }
  // 栏目识别（扩展）
  var zone=null;
  if(/听写/.test(t)) zone='dictation';
  else if(/默写/.test(t)) zone='write';
  else if(/背诵|背书/.test(t)) zone='recite';
  else if(/注释|释义|解释/.test(t)) zone='annot';
  else if(/测验|测试|月考|单元考|考试|考卷|期中|期末|模拟考/.test(t)) zone='exam';
  else if(/作业|练习|习题|刷题|题单/.test(t)) zone='homework';
  // 错字提取（多种表述）
  var errs=[];
  function pushErr(c){ c=String(c||'').trim(); if(c && c.length<=4 && !/写|错|字|成|了|把|将|的|有|是|为|：|:|，|,|、/.test(c)) errs.push(c); }
  var m;
  var reA=/([\u4e00-\u9fa5])\s*字?(?:写错|不会写|写不来|记错|默错|念错)/g;
  while((m=reA.exec(t))!==null){ pushErr(m[1]); }
  var reB=/(?:把|将)?\s*([\u4e00-\u9fa5])\s*(?:写成了|写成|误写为|写为了)\s*([\u4e00-\u9fa5])/g;
  while((m=reB.exec(t))!==null){ pushErr(m[2]); }
  var reC=/(?:错字|错别字|写错的?字?|错的?字|不会写的字)(?:有|是|为|：|:|，|,)?\s*([\u4e00-\u9fa5、，,\s]+?)(?:[。\n]|$)/g;
  while((m=reC.exec(t))!==null){
    var parts=m[1].split(/[、，,\s]+/);
    for(j=0;j<parts.length;j++) pushErr(parts[j]);
  }
  var uq={}, ue=[];
  for(i=0;i<errs.length;i++){ var e=errs[i]; if(e&&!uq[e]){ uq[e]=1; ue.push(e); } }
  // 内容提取
  var content='';
  var cm = t.match(/《([^》]+)》/) || t.match(/[“"]([^”"]{2,20})[”"]/);
  if(cm) content = cm[1];
  if(!content){
    var kw = t.match(/(?:听写|默写|背诵|注释|测试|测验|月考|单元考|考试|作业|练习)\s*[了]?\s*([\u4e00-\u9fa5]{2,12})/);
    if(kw) content = kw[1].replace(/(的|时|中|里|错|字|卷|次|第|一|二|三|四|五|六|七|八|九|十)$/,'');
  }
  if(!content && ue.length) content = ue.join('、');
  // 学生听写/栏目记录
  if(stu && zone){
    sug.push({type:'record', title:stu.name+' · '+zoneName(zone), studentId:stu.id, zone:zone,
      content:content||t.slice(0,30), errs:ue,
      desc:'内容「'+(content||t.slice(0,30))+'」'+(ue.length?('，错字标红：'+ue.join('、')):'，无错字')});
  }else if(stu && ue.length){
    sug.push({type:'record', title:stu.name+' · 听写（默认栏目，可改）', studentId:stu.id, zone:'dictation',
      content:content||ue.join('、'), errs:ue, desc:'未指明栏目，默认归入听写；错字：'+ue.join('、')});
  }
  // 健康数值（扩展）
  var g=t.match(/血糖\s*[:：]?\s*([\d.]+)/);
  if(g) sug.push({type:'health', panel:'glucose', title:'骄阳永灿 · 血糖', val:parseFloat(g[1]), desc:'记录血糖 '+g[1]+' mmol/L'});
  var bp=t.match(/血压\s*[:：]?\s*([\d.]+)\s*(?:\/|到|至|-|~)?\s*([\d.]+)?/);
  if(bp) sug.push({type:'health', panel:'bp', title:'骄阳永灿 · 血压', val:parseFloat(bp[1]), note:(bp[2]?('低压 '+bp[2]):''), desc:'记录血压 '+(bp[2]?(bp[1]+'/'+bp[2]):bp[1])+' mmHg'});
  var hr=t.match(/(?:心率|脉搏|心跳)\s*[:：]?\s*([\d.]+)/);
  if(hr) sug.push({type:'health', panel:'hr', title:'骄阳永灿 · 心率', val:parseFloat(hr[1]), desc:'记录心率 '+hr[1]+' 次/分'});
  var w=t.match(/体重\s*[:：]?\s*([\d.]+)/);
  if(w) sug.push({type:'health', panel:'weight', title:'骄阳永灿 · 体重', val:parseFloat(w[1]), desc:'记录体重 '+w[1]+' kg'});
  var sp=t.match(/(?:运动|跑步|快走|健走|骑行|游泳|瑜伽|跳操|健身)\s*[了]?\s*([\d.]+)\s*(分钟|公里|km|小时|个钟)?/);
  if(sp) sug.push({type:'health', panel:'sport', title:'骄阳永灿 · 运动', val:parseFloat(sp[1]),
    note:(sp[0]||'').replace(/[\d.]+.*$/,'')+(sp[2]||'分钟'), desc:'记录运动 '+sp[1]+' '+(sp[2]||'分钟')});
  var sl=t.match(/睡眠\s*[:：]?\s*([\d.]+)\s*(小时|h|个钟)?/);
  if(sl) sug.push({type:'health', panel:'sleep', title:'骄阳永灿 · 睡眠', val:parseFloat(sl[1]), note:(sl[2]||'小时'), desc:'记录睡眠 '+sl[1]+' 小时'});
  if(/早餐|午餐|晚餐|吃了|加餐|饮食|喝|吃饭/.test(t)) sug.push({type:'health', panel:'diet', title:'骄阳永灿 · 餐饮', val:t.slice(0,40), desc:'记入餐饮记录'});
  // 进修
  if(/学习|进修|听课|读了|看完|课程|培训|笔记|学了/.test(t) && DB.study.projects.length)
    sug.push({type:'study', title:'骄阳永灿 · 进修（'+DB.study.projects[0].name+'）', projectId:DB.study.projects[0].id, result:t.slice(0,60), desc:'记入进修成果'});
  // 待办（含日期解析）
  if(/记得|提醒|明天|后天|大后天|下周|待办|要交|截止|别忘|周[一二三四五六日天]|[\d]{1,2}月[\d]{1,2}[日号]/.test(t)){
    var td=parseTodoDate(t);
    sug.push({type:'todo', title:'仪表盘 · 待办事项', text:t.slice(0,40), date:td?fmtDate(td):todayStr(), desc:'新增待办'+(td?('，目标日 '+fmtDate(td)):'（默认今天）')});
  }
  // 素材/文章（扩展）
  if(/文章|试卷|阅读|作文|佳句|素材|摘抄|议论文|记叙文|说明文|散文|诗歌|随笔|读后感|好词|好句|美文/.test(t))
    sug.push({type:'mat', title:'花团锦簇 · 素材库', text:t, desc:'存入素材库并做文体解析'});
  if(!sug.length) sug.push({type:'memo', title:'仅存为速记', text:t, desc:'未识别到明确归属，先存速记流水，稍后可手动分配'});
  return sug;
}
function parseTodoDate(t){
  var d=new Date(); d.setHours(0,0,0,0);
  var mm=t.match(/(\d{1,2})月(\d{1,2})[日号]?/);
  if(mm){ var y=d.getFullYear(), mo=parseInt(mm[1],10), da=parseInt(mm[2],10);
    if(mo>=1&&mo<=12&&da>=1&&da<=31){ if(mo<(d.getMonth()+1)||(mo===d.getMonth()+1&&da<d.getDate())) y++; return new Date(y,mo-1,da); } }
  var wd=t.match(/(周|星期)(一|二|三|四|五|六|日|天)/);
  if(wd){ var wmap={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0}; var tw=wmap[wd[2]]; var diff=(tw-d.getDay()+7)%7; if(diff===0) diff=7; var nd=new Date(d); nd.setDate(d.getDate()+diff); return nd; }
  if(/明天/.test(t)){ var n1=new Date(d); n1.setDate(d.getDate()+1); return n1; }
  if(/后天/.test(t)){ var n2=new Date(d); n2.setDate(d.getDate()+2); return n2; }
  if(/大后天/.test(t)){ var n3=new Date(d); n3.setDate(d.getDate()+3); return n3; }
  if(/下周/.test(t)){ var n4=new Date(d); n4.setDate(d.getDate()+7); return n4; }
  return null;
}
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/* =======================================================================
   月度自动总结（每月 25 日）：红字<20 加小红花，>80 姓名变蓝
   ======================================================================= */
function runMonthlySummary(force){
  var d=new Date(), mk=monthKey();
  if(!force){ if(d.getDate()<25) return null; if(DB.meta.summaryMonth===mk) return null; }
  var good=[], warn=[], i;
  for(i=0;i<DB.students.length;i++){
    var s=DB.students[i], n=errCount(s.id);
    if(n<20){ s.flowers=(s.flowers||0)+1; good.push(s.name+'（'+n+'）'); }
    if(n>80) warn.push(s.name+'（'+n+'）');
  }
  DB.meta.summaryMonth=mk; save();
  return {month:mk, good:good, warn:warn};
}

var recog=null, recogOn=false, recogFinal='';
function toggleVoice(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    // 移动端/华为浏览器不支持时：引导用输入法自带语音键盘，并聚焦输入框方便直接说话转文字
    var mi=$('memo'); if(mi) mi.focus();
    toast('当前浏览器不支持网页语音。请用输入法键盘上的麦克风图标语音转文字（华为可用搜狗/百度输入法麦克风），说完后文字会自动进框，再点「分析归类」');
    return;
  }
  var btn=$('mic-btn');
  if(recogOn && recog){ try{ recog.stop(); }catch(e){} return; }
  recog = new SR(); recog.lang='zh-CN'; recog.continuous=false; recog.interimResults=false; // 短句模式，避免长连接卡顿与逐字刷屏
  recogFinal='';
  recog.onstart=function(){ recogOn=true; if(btn){ btn.classList.add('p'); btn.innerHTML='<svg><use href="#i-mic"/></svg>正在聆听…点此结束'; } };
  recog.onresult=function(e){
    for(var i=0;i<e.results.length;i++){ if(e.results[i].isFinal) recogFinal += e.results[i][0].transcript; }
  };
  recog.onerror=function(ev){
    recogOn=false; if(btn){ btn.classList.remove('p'); btn.innerHTML='<svg><use href="#i-mic"/></svg>语音输入'; }
    var err=ev&&ev.error;
    if(err==='not-allowed') toast('麦克风权限被拒绝，请在浏览器地址栏左侧允许麦克风');
    else if(err==='network') toast('语音服务网络异常，请换网络或改用输入法语音键盘');
    else if(err!=='no-speech'&&err!=='aborted') toast('语音识别中断，请重试');
  };
  recog.onend=function(){
    recogOn=false; if(btn){ btn.classList.remove('p'); btn.innerHTML='<svg><use href="#i-mic"/></svg>语音输入'; }
    var cur=$('memo').value.trim();
    if(recogFinal){ $('memo').value = (cur?cur+' ':'')+recogFinal; recogFinal=''; }
  };
  try{ recog.start(); }catch(e){ toast('无法启动语音识别'); }
}
function compressImage(file, maxW, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, mw=maxW||800;
      if(w>mw){ h=Math.round(h*mw/w); w=mw; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}
function pickFiles(accept, multiple, cb){
  var el=$('hidden-file'); if(!el) return;
  el.value=''; el.accept=accept||''; el.multiple=!!multiple;
  el.onchange=function(){ var fs=el.files; if(fs&&fs.length) cb(fs); };
  el.click();
}
/* ---------- 百度 OCR（图片转文字） ---------- */
function baiduOcrGetToken(cb){
  if(SYNC.ocrTok && SYNC.ocrExp && Date.now()<SYNC.ocrExp){ cb(SYNC.ocrTok); return; }
  if(!SYNC.ocrAk || !SYNC.ocrSk){ cb(null); return; }
  var url='https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id='+encodeURIComponent(SYNC.ocrAk)+'&client_secret='+encodeURIComponent(SYNC.ocrSk);
  fetch(url).then(function(r){return r.json();}).then(function(d){
    if(d&&d.access_token){ SYNC.ocrTok=d.access_token; SYNC.ocrExp=Date.now()+((d.expires_in||2592000)*1000); saveSyncCfg(); cb(SYNC.ocrTok); }
    else cb(null);
  }).catch(function(){ cb(null); });
}
function baiduOcrRecognize(base64, cb){
  baiduOcrGetToken(function(tok){
    if(!tok){ cb(null,'未配置百度 OCR（设置里填 API Key/Secret）'); return; }
    var b64=(base64.split(',')[1]||base64);
    var body='image='+encodeURIComponent(b64)+'&language_type=CHN_ENG';
    fetch('https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic?access_token='+tok, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body
    }).then(function(r){return r.json();}).then(function(d){
      if(d&&d.words_result&&d.words_result.length){ cb(d.words_result.map(function(x){return x.words;}).join('\n'), null); }
      else if(d&&d.error_msg){ cb(null, d.error_msg); }
      else cb(null,'未识别到文字');
    }).catch(function(e){ cb(null,'OCR 网络错误：'+(e&&e.message||e)); });
  });
}
function pickMemoImage(){
  pickFiles('image/*', true, function(fs){
    var n=Math.min(fs.length, 9-UI.memoImgs.length);
    if(n<=0){ toast('最多 9 张图片'); return; }
    var done=0, ocrTexts=[];
    var useOcr = !!(SYNC.ocrAk && SYNC.ocrSk);
    if(useOcr) toast('正在 OCR 识别图片文字…');
    for(var i=0;i<n;i++){
      (function(file){
        compressImage(file, 1200, function(data){
          if(data){
            UI.memoImgs.push(data);
            if(useOcr){
              baiduOcrRecognize(data, function(txt, err){
                if(txt) ocrTexts.push(txt);
                done++;
                if(done===n){
                  renderMemoImgs();
                  if(ocrTexts.length){
                    var merged=ocrTexts.join('\n');
                    var cur=$('memo').value.trim();
                    $('memo').value = (cur?cur+'\n':'')+merged;
                    toast('OCR 完成，文字已填入，点「分析归类」自动分配');
                  } else {
                    toast(err||'OCR 未识别到文字，可手动补录或重新拍照');
                  }
                }
              });
            } else {
              done++;
              if(done===n){ renderMemoImgs(); toast('图片已附加。提示：未配置 OCR，请在设置填百度 API Key，或把图上文字念出来/打字补录'); }
            }
          } else {
            done++;
            if(done===n) renderMemoImgs();
          }
        });
      })(fs[i]);
    }
  });
}

function exportPng(title, lines){
  var W=820, pad=40, lh=34, H=pad*2+70+lines.length*lh;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=Math.max(H,340);
  var x=cv.getContext('2d');
  var gd=x.createLinearGradient(0,0,W,0); gd.addColorStop(0,'#FFF8ED'); gd.addColorStop(1,'#FFFDF7');
  x.fillStyle=gd; x.fillRect(0,0,W,cv.height);
  x.fillStyle='#FFB703'; x.fillRect(0,0,W,8);
  x.fillStyle='#2B2118'; x.font='bold 30px "KaiTi","Microsoft YaHei",serif';
  x.fillText(title, pad, pad+34);
  x.fillStyle='#8B7A66'; x.font='14px "Microsoft YaHei",sans-serif';
  x.fillText('导出时间：'+nowStr()+'  ·  幽径通骄阳', pad, pad+60);
  x.strokeStyle='#EADFCD'; x.beginPath(); x.moveTo(pad,pad+74); x.lineTo(W-pad,pad+74); x.stroke();
  for(var i=0;i<lines.length;i++){

}

  askConfirm('删除学生','确定删除 <b>'+esc(s.name)+'</b> 及其全部展示台记录、阅读错题？此操作不可恢复。', function(){
    DB.students=DB.students.filter(function(x){ return x.id!==id; });
    DB.records=DB.records.filter(function(r){ return r.studentId!==id; });
    DB.reading=DB.reading.filter(function(r){ return r.studentId!==id; });
    UI.stuId=null; save(); refreshAll(); toast('已删除');
  }, '删除');
}
function openStu(id){ UI.stuId=id; switchModule('path'); }
function closeStu(){ UI.stuId=null; renderPath(); window.scrollTo(0,0); }
function renderStuList(){
  var box=$('stu-list'); if(!box) return;
  if(!DB.students.length){ box.innerHTML='<div class="empty">还没有学生，点「添加学生」或「导入」。</div>'; return; }
  var groups={}, i;
  for(i=0;i<DB.students.length;i++){ var s=DB.students[i], k=s.classId||'';
    if(!groups[k]) groups[k]=[]; groups[k].push(s); }
  var h='', order=DB.classes.map(function(c){ return c.id; });
  if(groups['']) order.push('');
  for(var gi=0; gi<order.length; gi++){
    var cid=order[gi], arr=groups[cid]; if(!arr||!arr.length) continue;
    h += '<div style="grid-column:1/-1;margin:6px 0 2px;font-weight:800;font-family:var(--fs);letter-spacing:2px;font-size:15px">'+
         '<svg width="15" height="15" style="color:var(--m2)"><use href="#i-book"/></svg> '+esc(cid?clsName(cid):'未分班')+'</div>';
    for(i=0;i<arr.length;i++){ var st=arr[i], n=errCount(st.id), fl=st.flowers||0;
      h += '<button class="stu'+(n>80?' warn':'')+'" onclick="openStu(\''+st.id+'\')">'+
        '<span class="nm">'+esc(st.name)+(fl>0?flowerSvg(18):'')+(fl>1?('<span class="tiny">×'+fl+'</span>'):'')+'</span>'+
        '<span class="mt">红字 '+n+' 个 · '+(n<20?'优等':(n>80?'需重点辅导':'正常'))+'</span>'+
        '<span class="mt">'+esc(st.note||clsName(st.classId))+'</span></button>';
    }
  }
  box.innerHTML=h;
}
function renderStuStage(){
  var box=$('path-stage'); if(!box) return;
  var s=stuById(UI.stuId); if(!s){ box.innerHTML=''; return; }
  var total=errCount(s.id), i;
  var h='<div class="row no-print" style="margin-bottom:11px">'+
    '<button class="btn sm" onclick="closeStu()"><svg><use href="#i-back"/></svg>返回名单</button>'+
    '<span style="margin-left:auto"></span>'+
    '<button class="btn sm g" onclick="openRecordForm(\''+s.id+'\',\'dictation\')"><svg><use href="#i-plus"/></svg>录入记录</button>'+
    '<button class="btn sm" onclick="printExport(\'stage-print\',\''+esc(s.name)+'展示台\')"><svg><use href="#i-file"/></svg>整台导 PDF</button>'+
    '<button class="btn sm danger" onclick="delStudent(\''+s.id+'\')"><svg><use href="#i-trash"/></svg>删除学生</button></div>';
  h += '<div id="stage-print">';
  h += '<div class="card-hero"><h2>'+esc(s.name)+'展示台'+(s.flowers>0?flowerSvg(26):'')+'</h2>'+
    '<div style="font-size:13px;opacity:.92">'+esc(clsName(s.classId))+(s.note?(' · '+esc(s.note)):'')+' · 建档 '+esc(s.createdAt||'')+'</div>'+
    '<div class="hero-stats">';
  h += '<div>红字总计<b>'+total+'</b></div>';
  for(i=0;i<ZONES.length;i++) h += '<div>'+ZONES[i].n+'<b>'+errCountByZone(s.id, ZONES[i].k)+'</b></div>';
  h += '<div>小红花<b>'+(s.flowers||0)+'</b></div></div></div>';
  h += '<div class="grid g2">';
  for(i=0;i<ZONES.length;i++){
    var z=ZONES[i], recs=stuRecords(s.id, z.k);
    h += '<div class="zone"><div class="zone-h"><span class="dot" style="background:'+z.c+'"></span>'+z.n+
      '<span class="tag red">红字 '+errCountByZone(s.id,z.k)+'</span><span class="right no-print">'+
      '<button class="btn sm" onclick="openRecordForm(\''+s.id+'\',\''+z.k+'\')"><svg><use href="#i-plus"/></svg>加</button>'+
      '<button class="btn sm" onclick="printExport(\'zone-'+z.k+'\',\''+esc(s.name)+'·'+z.n+'\')"><svg><use href="#i-file"/></svg>PDF</button>'+
      '<button class="btn sm danger" onclick="clearStuZone(\''+s.id+'\',\''+z.k+'\')"><svg><use href="#i-trash"/></svg></button></span></div>'+
      '<div class="zone-b" id="zone-'+z.k+'">';
    if(!recs.length) h += '<div class="empty" style="padding:15px">暂无'+z.n+'记录</div>';
    for(var j=0;j<recs.length;j++){ var r=recs[j];
      h += '<div class="rec">'+markErr(r.content, r.errs)+
        '<div class="meta">'+esc(r.at)+(r.src?(' · '+esc(r.src)):'')+
        ((r.errs&&r.errs.length)?(' · 错字 '+r.errs.length+' 个'):' · 全对')+
        ' <button class="btn sm danger no-print" style="min-height:20px;padding:0 6px" onclick="delRecord(\''+r.id+'\')">删</button></div></div>';
    }
    h += '</div></div>';
  }
  h += '</div>';
  h += renderReadingZone(s);
  h += '</div>';
  box.innerHTML=h;
}
function clearStuZone(sid, zone){
  askConfirm('清空栏目','确定清空 <b>'+esc(stuById(sid).name)+'</b> 的「'+zoneName(zone)+'」全部记录？点击确定即刻删除。', function(){
    DB.records=DB.records.filter(function(r){ return !(r.studentId===sid && r.zone===zone); });
    save(); refreshAll(); toast('已清空');
  }, '确定清空');
}
function openRecordForm(sid, zone){
  var s=stuById(sid); if(!s) return;
  var opts='';
  for(var i=0;i<ZONES.length;i++) opts += '<option value="'+ZONES[i].k+'"'+(ZONES[i].k===zone?' selected':'')+'>'+ZONES[i].n+'</option>';
  var sopts='';
  for(i=0;i<DB.students.length;i++) sopts += '<option value="'+DB.students[i].id+'"'+(DB.students[i].id===sid?' selected':'')+'>'+esc(DB.students[i].name)+'</option>';
  openModal('录入记录',
    '<div class="inline-form"><div class="field"><label class="fl">学生</label><select id="rf-stu">'+sopts+'</select></div>'+
    '<div class="field"><label class="fl">栏目</label><select id="rf-zone">'+opts+'</select></div></div>'+
    '<div class="field"><label class="fl">内容（原句/词组/篇目）</label><textarea id="rf-content" placeholder="例：黄发垂髫，并怡然自乐"></textarea></div>'+
    '<div class="field"><label class="fl">错字（多个用顿号分隔，将自动标红）</label><input type="text" id="rf-errs" placeholder="例：髫、缤"></div>'+
    '<div class="tiny">写入前会检查重复字，若此前记录过会提示你确认。</div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn g" onclick="saveRecordForm()">保存</button>');
}
function saveRecordForm(){
  var sid=$('rf-stu').value, zone=$('rf-zone').value, c=$('rf-content').value.trim(), e=$('rf-errs').value.trim();
  if(!c && !e){ toast('请填写内容或错字'); return; }
  var errs = e? e.split(/[、，,\s]+/).filter(function(x){ return x; }) : [];
  closeModal();
  addRecordChecked(sid, zone, c||errs.join('、'), errs, '手动录入');
}
/* 重复字提示 → 确认后写入 */
function addRecordChecked(sid, zone, content, errs, src){
  errs = errs||[];
  var dup=[], i, j;
  for(i=0;i<errs.length;i++){
    for(j=0;j<DB.records.length;j++){
      var r=DB.records[j];
      if(r.studentId===sid && (r.errs||[]).indexOf(errs[i])>=0){ dup.push(errs[i]); break; }
    }
  }
  var write=function(){
    DB.records.unshift({id:uid(), studentId:sid, zone:zone, content:content, errs:errs, at:nowStr(), src:src||''});
    save(); refreshAll();
    toast('已写入 '+(stuById(sid)?stuById(sid).name:'')+' 的'+zoneName(zone));
  };
  if(dup.length){
    askConfirm('发现重复字',
      '「<span class="err">'+esc(dup.join('、'))+'</span>」在该学生此前的记录中已出现过。<br>是否仍要储存这条记录？',
      write, '仍要储存');
  }else write();
}
function delRecord(id){
  askConfirm('删除记录','确定删除这条记录？', function(){
    DB.records=DB.records.filter(function(r){ return r.id!==id; }); save(); refreshAll(); toast('已删除');
  }, '删除');
}
</script>
<script>
/* =======================================================================
   康庄幽径 · 阅读专区（模板函数，由 renderStuStage 单向调用）
   ======================================================================= */
function stuReadings(sid){
  var out=[]; for(var i=0;i<DB.reading.length;i++){ if(DB.reading[i].studentId===sid) out.push(DB.reading[i]); }
  return out.sort(function(a,b){ return a.at<b.at?1:-1; });
}
function renderReadingZone(s){
  var arr=stuReadings(s.id);
  var h='<div class="zone"><div class="zone-h"><span class="dot" style="background:var(--dop-violet)"></span>阅读专区'+
    '<span class="tag violet">'+arr.length+' 条</span>'+
    '<span class="right no-print">'+
    '<button class="btn sm v" onclick="openReadingForm(\''+s.id+'\')"><svg><use href="#i-plus"/></svg>加错题</button>'+
    '<button class="btn sm" onclick="printExport(\'read-zone\',\''+esc(s.name)+'·阅读专区\')"><svg><use href="#i-file"/></svg>PDF</button>'+
    '<button class="btn sm danger" onclick="clearReading(\''+s.id+'\')"><svg><use href="#i-trash"/></svg></button></span></div>'+
    '<div class="zone-b" id="read-zone">';
  if(!arr.length) h += '<div class="empty" style="padding:16px">暂无阅读错题。点「加错题」并链接到花团锦簇素材库，可定位到具体是哪套卷子的哪道题。</div>';
  for(var i=0;i<arr.length;i++){
    var r=arr[i], m=matById(r.matId);
    var pns=[]; if(m){ for(var j=0;j<(m.projects||[]).length;j++) pns.push(projName(m.lib, m.projects[j])); }
    h += '<div class="mat"><div class="t"><svg width="15" height="15" style="color:var(--dop-violet)"><use href="#i-book"/></svg>'+
      esc(r.question||'（未填题干）')+'</div>';
    h += '<div class="tiny">'+esc(r.at)+(r.qno?(' · '+esc(r.qno)):'')+'</div>';
    if(r.wrong) h += '<div style="font-size:14px;margin-top:5px">错因：<span class="err">'+esc(r.wrong)+'</span></div>';
    if(m) h += '<div class="row" style="margin-top:7px"><span class="tag violet"><svg width="12" height="12"><use href="#i-link"/></svg>素材库定位</span>'+
      '<span class="tiny">花团锦簇 · '+(m.lib==='work'?'工作素材':'学习素材')+' · '+esc(pns.join('/')||'未分类')+' · 《'+esc(m.title)+'》'+(r.qno?(' · '+esc(r.qno)):'')+'</span></div>';
    else h += '<div class="tiny" style="margin-top:6px">（未链接素材库）</div>';
    if((r.subs||[]).length){
      h += '<div class="zone" style="margin-top:9px"><div class="zone-h"><span class="dot" style="background:var(--dop-violet)"></span>细分方向<span class="tag violet">'+(r.subs||[]).length+'</span>'+
        '<span class="right no-print"><button class="btn sm" onclick="openSubForm(\''+r.id+'\')"><svg><use href="#i-plus"/></svg>加子项目</button></span></div><div class="zone-b">';
      for(var si=0; si<(r.subs||[]).length; si++){ var su=r.subs[si];
        h += '<div class="rec" style="border-left:4px solid var(--dop-violet)"><div style="font-weight:700">'+esc(su.name||'（未命名）')+
          ' <span class="tag violet" style="font-size:11px">'+esc(su.cat||'自定义')+'</span></div>'+
          (su.note?'<div class="tiny" style="margin-top:3px;white-space:pre-wrap">'+esc(su.note)+'</div>':'')+
          '<div class="row no-print" style="margin-top:5px"><button class="btn sm" onclick="openSubForm(\''+r.id+'\',\''+su.id+'\')"><svg><use href="#i-edit"/></svg>改名</button>'+
          '<button class="btn sm danger" onclick="delSub(\''+r.id+'\',\''+su.id+'\')"><svg><use href="#i-trash"/></svg>删</button></div></div>';
      }
      h += '</div></div>';
    } else {
      h += '<div class="row no-print" style="margin-top:8px"><button class="btn sm" onclick="openSubForm(\''+r.id+'\')"><svg><use href="#i-plus"/></svg>加子项目（按修辞/表现手法/表达方式/描写手法细分）</button></div>';
    }
    h += '<div class="row no-print" style="margin-top:8px">'+
      (m?'<button class="btn sm v" onclick="openMatAnalysis(\''+m.id+'\',\''+r.id+'\')"><svg><use href="#i-ai"/></svg>AI 解读文章</button>':'')+
      (m?'<button class="btn sm" onclick="openMatDetail(\''+m.id+'\')"><svg><use href="#i-eye"/></svg>看原文</button>':'')+
      '<button class="btn sm" onclick="openExportPack(\''+r.id+'\')"><svg><use href="#i-download"/></svg>导出题目/练习</button>'+
      '<button class="btn sm danger" onclick="delReading(\''+r.id+'\')"><svg><use href="#i-trash"/></svg>删</button></div>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}
function openReadingForm(sid){
  var mopts='<option value="">（不链接素材）</option>', i;
  for(i=0;i<DB.lib.mats.length;i++){ var m=DB.lib.mats[i];
    mopts += '<option value="'+m.id+'">'+esc((m.lib==='work'?'工作·':'学习·')+m.title)+'</option>'; }
  openModal('添加阅读错题',
    '<div class="field"><label class="fl">题干 / 考查点</label><textarea id="rd-q" placeholder="例：分析“那辆自行车吱呀作响，像父亲的脊背”的修辞及作用"></textarea></div>'+
    '<div class="inline-form"><div class="field"><label class="fl">链接素材库（哪套卷子/文章）</label><select id="rd-mat">'+mopts+'</select></div>'+
    '<div class="field"><label class="fl">题号定位</label><input type="text" id="rd-no" placeholder="例：第三大题第2小题"></div></div>'+
    '<div class="field"><label class="fl">错因</label><input type="text" id="rd-w" placeholder="例：只答出比喻，未答情感作用"></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn v" onclick="saveReading(\''+sid+'\')">保存</button>');
}
function saveReading(sid){
  var q=$('rd-q').value.trim();
  if(!q){ toast('请填写题干'); return; }
  DB.reading.unshift({id:uid(), studentId:sid, matId:$('rd-mat').value, qno:$('rd-no').value.trim(),
    question:q, wrong:$('rd-w').value.trim(), at:nowStr()});
  closeModal(); save(); refreshAll(); toast('阅读错题已记录');
}
function delReading(id){
  askConfirm('删除错题','确定删除这条阅读错题？', function(){
    DB.reading=DB.reading.filter(function(r){ return r.id!==id; }); save(); refreshAll(); toast('已删除');
  }, '删除');
}
function clearReading(sid){
  askConfirm('清空阅读专区','确定清空该学生阅读专区的全部错题？点击确定即刻删除。', function(){
    DB.reading=DB.reading.filter(function(r){ return r.studentId!==sid; }); save(); refreshAll(); toast('已清空');
  }, '确定清空');
}
function openSubForm(rid, subId){
  var r=null; for(var i=0;i<DB.reading.length;i++){ if(DB.reading[i].id===rid) r=DB.reading[i]; }
  if(!r) return;
  var su = subId ? (r.subs||[]).filter(function(x){ return x.id===subId;})[0] : null;
  var cats=['修辞','表现手法','表达方式','描写手法','自定义'];
  var opts=''; for(var c=0;c<cats.length;c++) opts += '<option value="'+cats[c]+'"'+(su&&su.cat===cats[c]?' selected':'')+'>'+cats[c]+'</option>';
  openModal(su?'重命名 / 编辑子项目':'为阅读素材加子项目',
    '<div class="tiny" style="margin-bottom:9px">按考查维度细分，例如：修辞、表现手法、表达方式、描写手法；子项目命名可自由编辑，可随时增删。</div>'+
    '<div class="field"><label class="fl">细分维度</label><select id="sub-cat">'+opts+'</select></div>'+
    '<div class="field"><label class="fl">子项目名称（可编辑）</label><input type="text" id="sub-name" placeholder="例：比喻的作用、借景抒情、记叙顺序" value="'+esc(su?su.name:'')+'"></div>'+
    '<div class="field"><label class="fl">内容 / 备注</label><textarea id="sub-note" placeholder="例：本体喻体、情感作用……">'+esc(su?su.note:'')+'</textarea></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn v" onclick="saveSub(\''+rid+'\''+(subId?',\''+subId+'\'':'')+')">保存</button>');
}
function saveSub(rid, subId){
  var r=null; for(var i=0;i<DB.reading.length;i++){ if(DB.reading[i].id===rid) r=DB.reading[i]; }
  if(!r) return;
  var name=$('sub-name').value.trim(), cat=$('sub-cat').value, note=$('sub-note').value.trim();
  if(!name){ toast('请填写子项目名称'); return; }
  if(!r.subs) r.subs=[];
  if(subId){ for(var i=0;i<r.subs.length;i++){ if(r.subs[i].id===subId){ r.subs[i].name=name; r.subs[i].cat=cat; r.subs[i].note=note; } } }
  else { r.subs.push({id:uid(), name:name, cat:cat, note:note}); }
  closeModal(); save(); refreshAll(); toast('已保存子项目');
}
function delSub(rid, subId){
  askConfirm('删除子项目','确定删除这个细分方向？', function(){
    var r=null; for(var i=0;i<DB.reading.length;i++){ if(DB.reading[i].id===rid) r=DB.reading[i]; }
    if(r&&r.subs) r.subs=r.subs.filter(function(x){ return x.id!==subId; });
    save(); refreshAll(); toast('已删除');
  }, '删除');
}
/* ---------- 文章解析弹窗 ---------- */
function analysisHtml(m, an){
  var h='<div class="row" style="margin-bottom:9px"><span class="tag violet"><svg width="13" height="13"><use href="#i-ai"/></svg>解析引擎（本地词库规则，离线可用）</span></div>';
  h += '<div class="zone"><div class="zone-h">体裁判定</div><div class="zone-b"><div style="font-size:17px;font-weight:800">'+esc(an.genre)+'</div>';
  var sc=an.genreScore||{}, k, parts=[];
  for(k in sc) parts.push(k+'：'+Math.round(sc[k]*10)/10);
  h += '<div class="tiny" style="margin-top:5px">特征命中值 → '+esc(parts.join('　'))+'</div></div></div>';
  if(an.desc && an.desc.length){
    h += '<div class="zone"><div class="zone-h">描写手法</div><div class="zone-b"><div class="row">';
    for(var i=0;i<an.desc.length;i++) h += '<span class="tag mint">'+esc(an.desc[i])+'</span>';
    h += '</div></div></div>';
  }
  h += '<div class="zone"><div class="zone-h">修辞识别</div><div class="zone-b"><div class="row">';
  for(i=0;i<an.rhet.length;i++) h += '<span class="tag rose">'+esc(an.rhet[i])+'</span>';
  h += '</div></div></div>';
  if(an.skill && an.skill.length){
    h += '<div class="zone"><div class="zone-h">表现手法</div><div class="zone-b"><div class="row">';
    for(i=0;i<an.skill.length;i++) h += '<span class="tag sky">'+esc(an.skill[i])+'</span>';
    h += '</div></div></div>';
  }
  h += '<div class="zone"><div class="zone-h">题型划分</div><div class="zone-b">';
  for(i=0;i<an.qtypes.length;i++) h += '<div class="rec">'+(i+1)+'. '+esc(an.qtypes[i])+'</div>';
  h += '</div></div>';
  h += '<div class="zone"><div class="zone-h">针对性建议</div><div class="zone-b">';
  for(i=0;i<an.advice.length;i++) h += '<div class="rec">· '+esc(an.advice[i])+'</div>';
  h += '</div></div>';
  var kw = encodeURIComponent(an.genre.replace(/（.*?）/g,'') + ' ' + (an.rhet[0]||'') + ' ' + (an.qtypes[0]||'') + ' 阅读练习题 含答案');
  h += '<div class="zone no-print"><div class="zone-h">同类型题目练习（全网检索）</div><div class="zone-b"><div class="row">'+
    '<a class="btn sm s" target="_blank" rel="noopener" href="https://www.bing.com/search?q='+kw+'"><svg><use href="#i-search"/></svg>必应检索</a>'+
    '<a class="btn sm s" target="_blank" rel="noopener" href="https://www.baidu.com/s?wd='+kw+'"><svg><use href="#i-search"/></svg>百度检索</a>'+
    '<a class="btn sm s" target="_blank" rel="noopener" href="https://www.zxxk.com/search/?q='+kw+'"><svg><use href="#i-link"/></svg>学科网</a>'+
    '</div><div class="tiny" style="margin-top:6px">检索关键词：'+esc(decodeURIComponent(kw))+'</div></div></div>';
  return h;
}
function openMatAnalysis(matId, readingId){
  var m=matById(matId); if(!m){ toast('素材不存在'); return; }

function classIdByName(name){
  if(!name) return '';
  for(var i=0;i<DB.classes.length;i++){ if(DB.classes[i].name===name) return DB.classes[i].id; }
  var c={id:uid(), name:name}; DB.classes.push(c); return c.id;
}
function importStudentLines(text){
  var lines=String(text).replace(/\r/g,'').split('\n'), added=0;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim(); if(!ln) continue;
    if(/^姓名/.test(ln)) continue;
    var cells = ln.indexOf(',')>=0 ? ln.split(',') : (ln.indexOf('\t')>=0 ? ln.split('\t') : [ln]);
    if(cells.length===1 && /[、，]/.test(cells[0])){
      var names=cells[0].split(/[、，]/);
      for(var j=0;j<names.length;j++){ var n2=names[j].trim().replace(/^"|"$/g,'');
        if(n2){ DB.students.push({id:uid(),name:n2,classId:'',note:'',createdAt:nowStr(),flowers:0}); added++; } }
      continue;
    }
    var nm=(cells[0]||'').trim().replace(/^"|"$/g,'');
    if(!nm) continue;
    var cls=(cells[1]||'').trim().replace(/^"|"$/g,'');
    var note=(cells[2]||'').trim().replace(/^"|"$/g,'');
    DB.students.push({id:uid(), name:nm, classId:classIdByName(cls), note:note, createdAt:nowStr(), flowers:0});
    added++;
  }
  return added;
}
function importStudentsText(){
  var t=$('imp-txt'); if(!t) return;
  var n=importStudentLines(t.value);
  closeModal(); save(); refreshAll();
  toast(n? ('已导入 '+n+' 名学生') : '没有解析到有效姓名');
}
function importStudentsFile(){
  pickFiles('.csv,.txt,.json,text/csv,text/plain,application/json', false, function(fs){
    var fr=new FileReader();
    fr.onload=function(){
      var txt=String(fr.result), n=0;
      if(/^\s*[\[{]/.test(txt)){
        try{ var j=JSON.parse(txt);
          var arr = Array.isArray(j) ? j : (j.students||[]);
          for(var i=0;i<arr.length;i++){ var s=arr[i];
            if(!s || !s.name) continue;
            DB.students.push({id:uid(), name:s.name, classId: s.className? classIdByName(s.className) : (s.classId||''),
              note:s.note||'', createdAt:nowStr(), flowers:s.flowers||0}); n++; }
        }catch(e){ toast('JSON 解析失败'); return; }
      }else n=importStudentLines(txt);
      closeModal(); save(); refreshAll();
      toast(n? ('已导入 '+n+' 名学生') : '没有解析到有效姓名');
    };
    fr.readAsText(fs[0], 'utf-8');
  });
}

/* ---------- 折线图（手写内联 SVG） ---------- */
function lineChart(vals, labels, color){
  if(!vals.length) return '<div class="empty" style="padding:16px">暂无数据</div>';
  var W=Math.max(320, vals.length*54), H=170, pl=38, pb=26, pt=14;
  var mx=Math.max.apply(null, vals), mn=Math.min.apply(null, vals);
  if(mx===mn){ mx=mx+1; mn=mn-1; }
  var sx=function(i){ return pl + (vals.length===1? (W-pl-14)/2 : i*(W-pl-14)/(vals.length-1)); };
  var sy=function(v){ return pt + (H-pt-pb) * (1-(v-mn)/(mx-mn)); };
  var pts=[], i;
  for(i=0;i<vals.length;i++) pts.push(sx(i).toFixed(1)+','+sy(vals[i]).toFixed(1));
  var g='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(i=0;i<=3;i++){ var y=pt+(H-pt-pb)*i/3;
    g += '<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-8)+'" y2="'+y.toFixed(1)+'" stroke="#F3EADB" stroke-width="1"/>'+
      '<text x="4" y="'+(y+4).toFixed(1)+'" font-size="10" fill="#8B7A66">'+(mx-(mx-mn)*i/3).toFixed(1)+'</text>'; }
  g += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  for(i=0;i<vals.length;i++){
    g += '<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(vals[i]).toFixed(1)+'" r="4" fill="#fff" stroke="'+color+'" stroke-width="2.5"/>'+
      '<text x="'+sx(i).toFixed(1)+'" y="'+(sy(vals[i])-9).toFixed(1)+'" font-size="10" text-anchor="middle" fill="#5C4B3A" font-weight="700">'+vals[i]+'</text>'+
      '<text x="'+sx(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#8B7A66">'+esc(labels[i])+'</text>';
  }
  return '<div class="chartbox">'+g+'</svg></div>';
}

    (p.k==='glucose'?'<div>理想区间<b>5–6</b></div>':'')+
    (p.k==='weight'?'<div>规则<b>降↓加花</b></div>':'')+'</div></div>';
  if(p.unit!=='内容'){
    var vals=[], labs=[];
    for(i=Math.max(0,arr.length-10);i<arr.length;i++){ vals.push(+arr[i].val||0); labs.push(arr[i].m+'/'+arr[i].d); }
    h += '<div class="card"><div class="card-h"><svg width="18" height="18" style="color:'+p.c+'"><use href="#i-chart"/></svg><h3>近期趋势</h3></div>'+
      lineChart(vals, labs, p.c)+'</div>';
  }
  h += '<div class="card"><div class="card-h"><svg width="18" height="18" style="color:'+p.c+'"><use href="#i-cal"/></svg><h3>全部记录</h3>'+
    '<span class="right tiny">年 / 月 / 日 / 时间 / '+(p.unit==='内容'?'内容':'数值')+'</span></div><div id="health-print">';
  if(!arr.length) h += '<div class="empty">暂无记录，点「新增记录」。</div>';
  for(i=arr.length-1;i>=0;i--){
    var r=arr[i], prev=i>0?arr[i-1]:null, trend='';
    if(prev && p.unit!=='内容'){
      var d=(+r.val)-(+prev.val);
      if(d<0) trend='<span class="tag mint">↓'+Math.abs(Math.round(d*100)/100)+'</span>';
      else if(d>0) trend='<span class="tag red">↑'+(Math.round(d*100)/100)+'</span>';
      else trend='<span class="tag">持平</span>';
    }
    var bad = (p.k==='glucose' && +r.val>7.5);
    var good = (p.k==='glucose' && +r.val>=5 && +r.val<=6);
    h += '<div class="item"'+(bad?' style="border-color:#F6C4C5;background:#FFF6F6"':'')+'>'+
      '<div class="grow"><div style="font-weight:800;font-size:16px'+(bad?';color:var(--red)':'')+'">'+
      esc(String(r.val))+(p.unit==='内容'?'':(' '+p.unit))+' '+trend+
      (good?'<span class="tag mint">理想区间</span>':'')+(bad?'<span class="tag red">偏高</span>':'')+'</div>'+
      '<div class="tiny">'+r.y+' 年 '+r.m+' 月 '+r.d+' 日 '+esc(r.t||'')+(r.note?(' · '+esc(r.note)):'')+'</div></div>'+
      '<div class="ops no-print"><button class="btn sm danger" onclick="delHealth(\''+p.k+'\',\''+r.id+'\')"><svg><use href="#i-trash"/></svg></button></div></div>';
  }
  h += '</div></div>';
  box.innerHTML=h;
}
function openHealthForm(k){
  var p=null; for(var i=0;i<SUNP.length;i++){ if(SUNP[i].k===k) p=SUNP[i]; }
  var d=new Date();
  openModal('新增'+p.n+'记录',
    '<div class="inline-form">'+
    '<div class="field"><label class="fl">日期</label><input type="date" id="hf-date" value="'+todayStr()+'"></div>'+
    '<div class="field"><label class="fl">时间</label><input type="time" id="hf-time" value="'+pad(d.getHours())+':'+pad(d.getMinutes())+'"></div></div>'+
    '<div class="field"><label class="fl">'+(p.unit==='内容'?'内容':'数值（'+p.unit+'）')+'</label>'+
    (p.unit==='内容'? '<textarea id="hf-val" placeholder="例：杂粮饭+清蒸鱼+时蔬，七分饱"></textarea>'
                    : '<input type="number" step="0.01" inputmode="decimal" id="hf-val" placeholder="例：'+(k==='glucose'?'5.6':(k==='weight'?'62.5':'40'))+'">')+'</div>'+
    '<div class="field"><label class="fl">备注</label><input type="text" id="hf-note" placeholder="选填，如：空腹 / 快走4公里"></div>'+
    (k==='glucose'?'<div class="tiny">规则：下降且落在 5–6 → 放烟花 + 加小红花；超过 7.5 → 扣花并整页标红提醒。</div>':'')+
    (k==='weight'?'<div class="tiny">规则：比上一条下降 → 加小红花；上升 → 扣除小红花。</div>':''),
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn o" onclick="saveHealthForm(\''+k+'\')">保存</button>');
}
function saveHealthForm(k){
  var v=$('hf-val').value, note=$('hf-note').value.trim(), ds=$('hf-date').value||todayStr(), t=$('hf-time').value||'';
  if(v===''||v==null){ toast('请填写内容'); return; }
  closeModal();
  addHealthRecord(k, (k==='diet'? v : parseFloat(v)), note, {ds:ds, t:t});
}
function addHealthRecord(k, val, note, when){
  var arr=DB.health[k]; if(!arr){ DB.health[k]=[]; arr=DB.health[k]; }
  var ds=(when&&when.ds)||todayStr(), t=(when&&when.t)||nowStr().split(' ')[1];
  var p=ds.split('-'), prev=arr.length?arr[arr.length-1]:null;
  arr.push({id:uid(), y:+p[0], m:+p[1], d:+p[2], t:t, val:val, note:note||'', at:nowStr()});
  arr.sort(function(a,b){
    var ka=a.y*10000+a.m*100+a.d, kb=b.y*10000+b.m*100+b.d;
    if(ka!==kb) return ka-kb; return (a.t||'')<(b.t||'')?-1:1; });
  var msg='已记录';
  if(k==='weight' && prev){
    if(+val < +prev.val){ addFlower(1, '体重下降至 '+val+' kg'); msg='体重下降，奖励小红花 +1'; boom(24,['#FF4D6D','#FFB703','#06D6A0']); }
    else if(+val > +prev.val){ addFlower(-1, '体重上升至 '+val+' kg'); msg='体重上升，扣除小红花 -1'; }
  }
  if(k==='glucose'){
    if(+val>7.5){ addFlower(-1, '血糖偏高 '+val); msg='血糖 '+val+' 偏高，扣除小红花并标红提醒'; }
    else if(+val>=5 && +val<=6 && prev && +val < +prev.val){
      addFlower(1, '血糖下降至理想区间 '+val); msg='血糖降入理想区间，放烟花 + 小红花 +1'; boom(46);
    }
  }
  save(); refreshAll(); toast(msg);
}
function addFlower(delta, reason){
  DB.flowers.total = Math.max(0, (DB.flowers.total||0) + delta);
  DB.flowers.log.unshift({delta:delta, reason:reason, at:nowStr()});
  if(DB.flowers.log.length>200) DB.flowers.log.length=200;
}
function delHealth(k, id){
  askConfirm('删除记录','确定删除这条记录？', function(){
    DB.health[k]=DB.health[k].filter(function(r){ return r.id!==id; }); save(); refreshAll(); toast('已删除');
  }, '删除');
}
function clearHealth(k){
  var p=null; for(var i=0;i<SUNP.length;i++){ if(SUNP[i].k===k) p=SUNP[i]; }
  askConfirm('一键清空','确定清空「'+p.n+'」全部记录？点击确定即刻删除。', function(){
    DB.health[k]=[]; save(); refreshAll(); toast('已清空');
  }, '确定清空');
}
function exportHealthCsv(k){
  var p=null; for(var i=0;i<SUNP.length;i++){ if(SUNP[i].k===k) p=SUNP[i]; }
  var rows=[['年','月','日','时间',(p.unit==='内容'?'内容':'数值('+p.unit+')'),'备注','录入时间']], arr=DB.health[k];
  for(i=0;i<arr.length;i++){ var r=arr[i]; rows.push([r.y,r.m,r.d,r.t,r.val,r.note||'',r.at]); }
  download(p.n+'记录_'+todayStr()+'.csv', toCsv(rows), 'text/csv'); toast('CSV 已导出');
}
function importHealthPick(k){
  openModal('导入记录',
    '<div class="tiny" style="line-height:1.9">支持 <b>CSV / TXT</b>（Excel 请另存为 CSV），每行：<code>日期,时间,数值,备注</code>，例：<br>'+
    '<code>2026-08-20,07:30,62.6,晨起</code><br>也可直接粘贴多行文本导入。<br>'+
    '<span style="color:var(--red)">图片 / PDF 属于二进制或影像格式，纯本地网页无法自动读出其中数字；可作为原稿附在素材库，数值请粘贴或手填。</span></div>'+
    '<div class="field" style="margin-top:11px"><textarea id="hi-txt" placeholder="2026-08-20,07:30,62.6,晨起&#10;2026-08-22,07:20,62.1"></textarea></div>',
    '<button class="btn sm" onclick="importHealthFile(\''+k+'\')"><svg><use href="#i-upload"/></svg>选择 CSV/TXT</button>'+
    '<button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn o" onclick="importHealthText(\''+k+'\')">导入粘贴内容</button>');
}
function parseHealthLines(k, text){
  var lines=String(text).replace(/\r/g,'').split('\n'), n=0;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim(); if(!ln || /^年|^日期/.test(ln)) continue;
    var c=ln.split(/[,\t]/);
    var ds=(c[0]||'').trim().replace(/[\/年月]/g,'-').replace(/日/,'');
    if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(ds)) continue;
    var t=(c[1]||'').trim(), v=(c[2]||'').trim(), note=(c[3]||'').trim();
    if(v==='') continue;
    var p=ds.split('-');
    DB.health[k].push({id:uid(), y:+p[0], m:+p[1], d:+p[2], t:t, val:(k==='diet'?v:parseFloat(v)), note:note, at:nowStr()});
    n++;
  }
  DB.health[k].sort(function(a,b){ var ka=a.y*10000+a.m*100+a.d, kb=b.y*10000+b.m*100+b.d;
    if(ka!==kb) return ka-kb; return (a.t||'')<(b.t||'')?-1:1; });
  return n;
}
function importHealthText(k){
  var n=parseHealthLines(k, $('hi-txt').value);
  closeModal(); save(); refreshAll(); toast(n? ('已导入 '+n+' 条'):'没有解析到有效数据');
}
function importHealthFile(k){
  pickFiles('.csv,.txt,text/csv,text/plain', false, function(fs){
    var fr=new FileReader();
    fr.onload=function(){ var n=parseHealthLines(k, String(fr.result));
      closeModal(); save(); refreshAll(); toast(n? ('已导入 '+n+' 条'):'没有解析到有效数据'); };
    fr.readAsText(fs[0],'utf-8');
  });
}

  h += '</div></div>';

  h += '<div id="study-print" class="study-cols">';
  for(i=0;i<DB.study.projects.length;i++){
